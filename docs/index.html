  // Additional generated questions (docs/data/mcq-data.js), deduped and merged with the hand-written seed set above.
  var MCQ = MCQ_SEED.concat(window.MCQ_GENERATED || []);
  var DRUGS = window.DRUG_DATA || [];

  /* ---------------- OSCE stations ---------------- */
  var OSCE = window.OSCE_STATIONS || [];
  var OSCE_STRATEGY = window.OSCE_STRATEGY || [];
  function strategyFor(type){
    for (var i=0;i<OSCE_STRATEGY.length;i++){ if (OSCE_STRATEGY[i].id===type) return OSCE_STRATEGY[i]; }
    return null;
  }
  function stationStrategyHtml(st){
    var s = strategyFor(st.type);
    if (!s) return "";
    return '<div class="panel" style="background:var(--surface-2);">'+
      '<h2 style="font-size:0.95rem;">Answering strategy — '+esc(s.label)+' <span style="color:var(--text-muted); font-weight:400; font-size:0.78rem;">('+esc(s.framework)+')</span></h2>'+
      '<ul style="margin:8px 0 0; padding-left:18px; font-size:0.86rem; line-height:1.55;">'+
      s.steps.map(function(step){ return '<li>'+highlightAbbrev(esc(step))+'</li>'; }).join("")+
      '</ul></div>';
  }

  /* ---------------- State ---------------- */
  var STORE_KEY = "pebcPrepState_v1";
  function loadState(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) return JSON.parse(raw);
    }catch(e){}
    return {mcqAttempts:[], osceAttempts:[]};
  }
  function saveState(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
  }
  var state = loadState();
  if (!state.mcqAttempts) state.mcqAttempts = [];
  if (!state.osceAttempts) state.osceAttempts = [];

  function computeStats(){
    var m = state.mcqAttempts, total = m.length, correct = 0;
    var byTopic = {};
    for (var i=0;i<m.length;i++){
      var a = m[i];
      if (!byTopic[a.topic]) byTopic[a.topic] = {total:0, correct:0};
      byTopic[a.topic].total++;
      if (a.correct){ correct++; byTopic[a.topic].correct++; }
    }
    var streak = 0, best = 0, run = 0;
    for (var j=0;j<m.length;j++){
      if (m[j].correct){ run++; if (run>best) best = run; } else { run = 0; }
    }
    for (var k=m.length-1;k>=0;k--){
      if (m[k].correct) streak++; else break;
    }
    var o = state.osceAttempts, oAvg = 0;
    if (o.length){
      var sum = 0; for (var x=0;x<o.length;x++) sum += o[x].score;
      oAvg = Math.round(sum / o.length);
    }
    return {total:total, correct:correct, pct: total? Math.round(correct/total*100):0,
      byTopic:byTopic, streak:streak, best:best, osceCount:o.length, osceAvg:oAvg};
  }

  function toast(msg){
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ el.classList.remove("show"); }, 2200);
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function fmtDate(ts){
    var d = new Date(ts);
    return d.toLocaleDateString(undefined,{month:"short",day:"numeric"}) + " " +
           d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
  }
  var speakingBtn = null;
  if ("speechSynthesis" in window){
    window.speechSynthesis.getVoices();
    window.speechSynthesis.addEventListener("voiceschanged", function(){ window.speechSynthesis.getVoices(); });
  }
  function pickVoice(preferNarrator){
    if (!("speechSynthesis" in window)) return null;
    var voices = window.speechSynthesis.getVoices();
    var enVoices = voices.filter(function(x){ return /^en/i.test(x.lang); });
    var quality = /Google|Natural|Enhanced|Premium|Neural|Siri/i;
    if (preferNarrator){
      var narrator = /Daniel|Arthur|Aaron|Guy|David|Male|Tom\b|Fred|Alex\b|Nathan|Oliver|Ryan|Matthew|Eric|Brian/i;
      var narratorPick =
        enVoices.find(function(x){ return quality.test(x.name) && narrator.test(x.name); }) ||
        enVoices.find(function(x){ return narrator.test(x.name); });
      if (narratorPick) return narratorPick;
    }
    return (
      enVoices.find(function(x){ return /^en-CA/i.test(x.lang) && quality.test(x.name); }) ||
      enVoices.find(function(x){ return quality.test(x.name); }) ||
      enVoices.find(function(x){ return /^en-CA/i.test(x.lang); }) ||
      enVoices.find(function(x){ return /^en-US/i.test(x.lang); }) ||
      enVoices[0] || voices[0] || null
    );
  }
  function speakDrugName(name, btnEl){
    if (!name || !("speechSynthesis" in window)) return;
    try{
      window.speechSynthesis.cancel();
      if (speakingBtn) speakingBtn.removeAttribute("data-playing");
      var u = new SpeechSynthesisUtterance(name);
      u.rate = 0.95;
      u.pitch = 1;
      var v = pickVoice();
      if (v) u.voice = v;
      if (btnEl){
        btnEl.setAttribute("data-playing","true");
        speakingBtn = btnEl;
        u.onend = u.onerror = function(){
          btnEl.removeAttribute("data-playing");
          if (speakingBtn===btnEl) speakingBtn = null;
        };
      }
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  /* ---------------- Audio Tutor ---------------- */
  var AudioTutor = (function(){
    var PREF_KEY = "pebcAudioPrefs_v1";
    var prefs = {rate:0.95, voiceURI:null};
    try{
      var raw = localStorage.getItem(PREF_KEY);
      if (raw){ var parsed = JSON.parse(raw); if (parsed) prefs = parsed; }
    }catch(e){}
    function savePrefs(){ try{ localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); }catch(e){} }

    var sentences = [];
    var idx = -1;
    var curKey = "";
    var title = "";
    var st = "stopped"; // stopped | playing | paused

    function splitSentences(text){
      text = String(text||"").replace(/\s+/g," ").trim();
      if (!text) return [];
      var parts = text.match(/[^.!?]+[.!?]+(\s+|$)|[^.!?]+$/g) || [text];
      return parts.map(function(s){ return s.trim(); }).filter(Boolean);
    }
    function buildFromBlocks(blocks){
      var all = [];
      (blocks||[]).forEach(function(b){ splitSentences(b).forEach(function(s){ all.push(s); }); });
      return all;
    }
    function speakCurrent(){
      if (!("speechSynthesis" in window)) return;
      if (idx<0 || idx>=sentences.length){ st="stopped"; renderBar(); return; }
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(sentences[idx]);
      u.rate = prefs.rate || 0.95;
      u.pitch = 0.9;
      var voices = window.speechSynthesis.getVoices();
      var v = (prefs.voiceURI && voices.find(function(x){ return x.voiceURI===prefs.voiceURI; })) || pickVoice(true);
      if (v) u.voice = v;
      u.onend = function(){
        if (st!=="playing") return;
        idx++;
        if (idx<sentences.length) speakCurrent(); else { st="stopped"; renderBar(); }
      };
      u.onerror = function(){ st="stopped"; renderBar(); };
      window.speechSynthesis.speak(u);
    }
    function play(key, blockTitle, blocks){
      if (key!==undefined){
        curKey = key;
        title = blockTitle;
        sentences = buildFromBlocks(blocks);
        idx = sentences.length ? 0 : -1;
      }
      if (!sentences.length) return;
      if (idx<0) idx = 0;
      st = "playing";
      speakCurrent();
      renderBar();
    }
    function toggle(key, blockTitle, blocks){
      var same = (key===curKey) && sentences.length;
      if (same && st==="playing"){ pause(); return; }
      if (same && st==="paused"){ resume(); return; }
      play(key, blockTitle, blocks);
    }
    function pause(){
      if (st!=="playing") return;
      try{ window.speechSynthesis.pause(); }catch(e){}
      st = "paused"; renderBar();
    }
    function resume(){
      if (st!=="paused") return;
      try{ window.speechSynthesis.resume(); }catch(e){}
      st = "playing"; renderBar();
    }
    function stop(){
      try{ window.speechSynthesis.cancel(); }catch(e){}
      st = "stopped"; idx = -1; sentences = []; title = ""; curKey = "";
      renderBar();
    }
    function step(delta){
      if (!sentences.length) return;
      var ni = idx + delta;
      if (ni<0 || ni>=sentences.length) return;
      idx = ni;
      if (st!=="stopped"){ st="playing"; speakCurrent(); }
      renderBar();
    }
    function setRate(r){ prefs.rate = r; savePrefs(); if (st==="playing") speakCurrent(); renderBar(); }
    function setVoiceURI(uri){ prefs.voiceURI = uri; savePrefs(); if (st==="playing") speakCurrent(); renderBar(); }
    function isPlayingFor(key){ return st!=="stopped" && curKey===key; }
    function isPaused(){ return st==="paused"; }

    function renderBar(){
      var bar = document.getElementById("audioBar");
      if (!bar) return;
      if (st==="stopped" || !sentences.length){ bar.classList.remove("active"); bar.innerHTML=""; return; }
      bar.classList.add("active");
      var voices = ("speechSynthesis" in window) ? window.speechSynthesis.getVoices().filter(function(x){ return /^en/i.test(x.lang); }) : [];
      var fallback = pickVoice();
      var voiceOptions = voices.map(function(v){
        var sel = prefs.voiceURI ? (prefs.voiceURI===v.voiceURI) : (fallback && fallback.voiceURI===v.voiceURI);
        return '<option value="'+esc(v.voiceURI)+'"'+(sel?' selected':'')+'>'+esc(v.name)+'</option>';
      }).join("");
      var rateOptions = [0.75,0.95,1.25,1.5,1.75].map(function(r){
        return '<option value="'+r+'"'+((prefs.rate||0.95)===r?' selected':'')+'>'+(r===0.95?"1x (narrator)":r+"x")+'</option>';
      }).join("");
      var pct = sentences.length ? Math.round(((idx+1)/sentences.length)*100) : 0;
      bar.innerHTML =
        '<div class="audio-progress"><div class="audio-progress-fill" style="width:'+pct+'%"></div></div>'+
        '<div class="audio-bar-inner">'+
          '<div class="audio-cap"><div class="audio-title">🎧 Audio tutor — '+esc(title)+'</div>'+
          '<div class="audio-line">'+esc(sentences[Math.max(idx,0)]||"")+'</div></div>'+
          '<div class="audio-controls">'+

  /* ---------------- MCQ logic ---------------- */
  function shuffle(arr){
    var a = arr.slice();
    for (var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
    }
    return a;
  }
  function buildQueue(){
    var pool = MCQ.map(function(q,idx){ return Object.assign({idx:idx}, q); });
    if (mcqFilter !== "all") pool = pool.filter(function(q){ return q.t===mcqFilter; });
    if (mcqDifficulty !== "all") pool = pool.filter(function(q){ return (q.d||"standard")===mcqDifficulty; });
    mcqQueue = shuffle(pool);
  }
  function nextQuestion(){
    if (mcqCaseMode){ nextCaseQuestion(); return; }
    if (!mcqQueue.length) buildQueue();
    mcqCurrent = mcqQueue.shift();
    mcqAnswered = false;
    render();
  }
  function buildCaseQueue(){ mcqCaseQueue = shuffle(MCQ_CASES); }
  function startCaseMode(){
    mcqCaseMode = true;
    buildCaseQueue();
    nextCase();
  }
  function exitCaseMode(){
    mcqCaseMode = false;
    mcqCaseCurrent = null;
    mcqCurrent = null;
    mcqAnswered = false;
    render();
  }
  function nextCase(){
    if (!mcqCaseQueue.length) buildCaseQueue();
    if (!mcqCaseQueue.length){ exitCaseMode(); return; }
    mcqCaseCurrent = mcqCaseQueue.shift();
    mcqCaseQIdx = 0;
    mcqCurrent = mcqCaseCurrent.questions[0];
    mcqAnswered = false;
    render();
    window.scrollTo(0,0);
  }
  function nextCaseQuestion(){
    if (mcqCaseQIdx + 1 < mcqCaseCurrent.questions.length){
      mcqCaseQIdx++;
      mcqCurrent = mcqCaseCurrent.questions[mcqCaseQIdx];
      mcqAnswered = false;
      render();
    } else {
      nextCase();
    }
  }
  function answerMcq(optionIdx){
    if (mcqAnswered || !mcqCurrent) return;
    mcqAnswered = true;
    mcqCurrent._chosen = optionIdx;
    var correct = optionIdx === mcqCurrent.a;
    state.mcqAttempts.push({ts:Date.now(), topic:mcqCurrent.t, correct:correct, chosen:optionIdx});
    saveState();
    render();
  }

  /* ---------------- OSCE logic ---------------- */
  function openStation(id){
    for (var i=0;i<OSCE.length;i++){ if (OSCE[i].id===id){ osceCurrent = OSCE[i]; break; } }
    osceRevealed = false;
    osceRatings = {comm:null, outcome:null, perf:null, misinfo:null, risk:null};
    osceRxAnswers = {};
    osceRxRevealed = false;
    stopTimer();
    timerSecs = (osceCurrent.tl||7)*60;
    render();
  }
  function closeStation(){
    osceCurrent = null; osceRevealed = false; stopTimer();
    render();
  }
  function setOsceRating(key, val){
    if (/^\d+$/.test(val)) val = parseInt(val, 10);
    osceRatings[key] = (osceRatings[key]===val) ? null : val;
    render();
  }
  function revealRxAnswers(){ osceRxRevealed = true; render(); }
  function setRxAnswer(idx, val){ osceRxAnswers[idx] = val; }
  function startTimer(){
    if (timerRunning) return;
    timerRunning = true;
    timerHandle = setInterval(function(){
      timerSecs = Math.max(0, timerSecs-1);
      updateTimerDisplay();
      if (timerSecs===0){ stopTimer(); render(); }
    }, 1000);
    render();
  }
  function stopTimer(){
    timerRunning = false;
    if (timerHandle) clearInterval(timerHandle);
    timerHandle = null;
  }
  function resetTimer(){
    stopTimer();
    timerSecs = ((osceCurrent && osceCurrent.tl) || 7)*60;
    render();
  }
  function updateTimerDisplay(){
    var el = document.getElementById("clockDisplay");
    if (!el) return;
    var mm = Math.floor(timerSecs/60), ss = timerSecs%60;
    el.textContent = (mm<10?"0":"")+mm+":"+(ss<10?"0":"")+ss;
  }
  function revealChecklist(){ osceRevealed = true; render(); }
  function computeOsceScore(){
    var boxes = document.querySelectorAll(".check-item input");
    var checked = 0;
    boxes.forEach(function(b){ if (b.checked) checked++; });
    return boxes.length ? Math.round(checked/boxes.length*100) : 0;
  }
  function saveOsceAttempt(){
    var score = computeOsceScore();
    state.osceAttempts.push({ts:Date.now(), id:osceCurrent.id, title:osceCurrent.ti, score:score, ratings:{comm:osceRatings.comm, outcome:osceRatings.outcome, perf:osceRatings.perf, misinfo:osceRatings.misinfo, risk:osceRatings.risk}});
    saveState();

  }

  /* ---------------- Export / Import / Reset ---------------- */
  function exportProgress(){
    var payload = JSON.stringify(state, null, 2);
    (async function(){
      try{
        var downloads = (window.claude && typeof window.claude.use === "function")
          ? await window.claude.use("downloads") : null;
        if (downloads){
          await downloads.save({filename:"pebc-prep-progress.json", data:payload});
          toast("Progress exported.");
          return;
        }
      }catch(e){ /* fall through to manual copy */ }
      var blob;
      try{ blob = new Blob([payload], {type:"application/json"}); }catch(e){}
      if (blob && window.URL && window.URL.createObjectURL){
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = "pebc-prep-progress.json";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
        toast("Progress exported.");
      } else {
        toast("Export unavailable in this view.");
      }
    })();
  }
  function importProgress(file){
    var reader = new FileReader();

        if (!data || !Array.isArray(data.mcqAttempts) || !Array.isArray(data.osceAttempts)){
          toast("That file doesn't look like a progress export.");
          return;
        }
        state = data;
        saveState();
        toast("Progress imported.");
        render();
      }catch(e){ toast("Couldn't read that file."); }
    };
    reader.readAsText(file);
  }

      mcqBlocks.push(mcqCurrent.q);
      mcqCurrent.o.forEach(function(opt,i){ mcqBlocks.push("Option "+letters2[i]+": "+opt+"."); });
      if (mcqAnswered){
        var isRight = mcqCurrent._chosen===mcqCurrent.a;
        mcqBlocks.push(narratorLine(isRight ? NARRATOR_RIGHT : NARRATOR_WRONG));
        mcqBlocks.push(isRight ? "You answered correctly." : "The correct answer is option "+letters2[mcqCurrent.a]+".");
        mcqBlocks.push(mcqCurrent.r);
        if (mcqCurrent.why){
          mcqBlocks.push(narratorLine(NARRATOR_BREAKDOWN));
          mcqCurrent.why.forEach(function(w,i){ if (w) mcqBlocks.push("Option "+letters2[i]+": "+w); });
        }
        if (mcqCurrent.m) mcqBlocks.push("Memory anchor: "+mcqCurrent.m);
      }
      wireListenBtns({mcq:{title:"MCQ question", blocks:mcqBlocks}});
    }
  }

        '<div class="pagehead"><h1>Study guides</h1><p>Fast, bite-sized review per competency topic — key facts, thresholds, and exam-trap pearls. Pick a topic.</p></div>'+
        (cards ? '<div class="station-grid">'+cards+'</div>' : '<div class="panel"><p class="empty">Study guides are still being generated for this topic set — check back soon.</p></div>');
      Array.prototype.forEach.call(document.querySelectorAll(".station-card"), function(btn){
        btn.addEventListener("click", function(){ openStudyGuide(btn.getAttribute("data-topic")); });

        '<h1>'+esc(guide.title)+'</h1>'+
        '<p>Underlined terms are abbreviations — tap one for the full meaning.</p>'+
        '<div style="margin-top:6px;">'+listenBtnHtml("study:"+studyCurrent,"Listen to this guide")+'</div>'+
      '</div>'+
      sectionsHtml+
      '<p class="footnote">High-yield review content — pairs well with MCQ Practice on the same topic to test recall right after reading. Full abbreviation list under Quick Reference → Abbreviations.</p>';

    document.getElementById("backStudy").addEventListener("click", closeStudyGuide);

  function renderCalculations(){

  function buildClassTutorScript(c){

    return {
      key: c.key, kind: "classes", title: c.name,
      hook: c.blurb+" Let's go mechanism to bedside on this one.",
      sections: [
        {heading:"What's true for the whole class", beats: generalBeats, checkTopic: c.topic},
        {heading:"How the members actually differ", beats: memberBeats, checkTopic: null},
        {heading:"Special populations to watch for", beats: popBeats, checkTopic: null}
      ].filter(function(s){ return s.beats.length; }),
      recap: "That's "+c.name+" — one shared mechanism, several personalities. Learn the class rule first, then learn exactly which member breaks it."
    };

  function getFormulaExamples(f){
    if (f.examples && f.examples.length) return f.examples;
    if (f.example) return [f.example];
    return [];
  }
  function buildCalcTutorScript(f){
    var exampleBeats = [];
    getFormulaExamples(f).forEach(function(ex, i){
      exampleBeats.push("Example "+(i+1)+": "+ex.problem, ex.solution);
    });
    return {
      key: f.key, kind: "calc", title: f.name,
      hook: "Let's master "+f.name+". "+f.explain,
      sections: [
        {heading:"The formula", beats:[f.formula], checkTopic:null},
        {heading:"How to apply it, step by step", beats:f.steps||[], checkTopic:null},
        {heading:"Worked examples", beats:exampleBeats, checkTopic:"calc"},
        {heading:"Where people go wrong", beats:f.pitfalls||[], checkTopic:null}
      ],
      recap: "Master this pattern — extract the numbers, set up the formula with units, solve, then sanity-check the answer — and this calculation type becomes automatic on exam day."
    };
  }
  function getTutorScript(kind, key){
    if (kind==="clinical" || kind==="juris"){
      return TUTOR_SCRIPTS.filter(function(s){ return s.kind===kind && s.key===key; })[0] || null;
    }
    if (kind==="classes"){
      var c = CLASSES.filter(function(x){ return x.key===key; })[0];
      return c ? buildClassTutorScript(c) : null;
    }
    if (kind==="calc"){
      var f = CALC_FORMULAS.filter(function(x){ return x.key===key; })[0];
      return f ? buildCalcTutorScript(f) : null;
    }
    return null;
  }
  function pickRandomMcq(checkTopic, domain){
    var pool = MCQ.filter(function(q){
      if (q.t !== checkTopic) return false;
      if (domain && q.domain !== domain) return false;
      return true;
    });
    if (!pool.length) return null;
    return pool[Math.floor(Math.random()*pool.length)];
  }

      list.sort(function(a,b){ return a.title.localeCompare(b.title); });

      var searchHtml = (tutorCategory==="classes" || tutorCategory==="calc") ?
        '<div class="panel" style="margin-bottom:16px;"><input type="text" class="textinput" id="tutorSearch" placeholder="Search '+esc(catInfo.label.toLowerCase())+'…" value="'+esc(tutorSearch)+'"></div>' : '';

      var cardsHtml = list.map(function(x){
        return '<button class="station-card" data-kind="'+x.kind+'" data-key="'+esc(x.key)+'">'+
          '<div class="st-title">'+esc(x.title)+'</div>'+
          '<div class="st-blurb">'+esc((x.blurb||"").slice(0,140))+'</div>'+
        '</button>';
      }).join("");

      document.getElementById("main").innerHTML =
        '<div class="pagehead"><button class="btn btn-ghost btn-sm" id="backTutorCat" style="margin-bottom:10px;">&larr; All tutor topics</button>'+
          '<h1>'+esc(catInfo.label)+'</h1><p>'+esc(catInfo.desc)+'</p></div>'+
        searchHtml+
        (cardsHtml ? '<div class="station-grid">'+cardsHtml+'</div>' : '<div class="panel"><p class="empty">This tutor content is still being generated — check back soon.</p></div>');

      document.getElementById("backTutorCat").addEventListener("click", backTutorCategory);
      var searchEl = document.getElementById("tutorSearch");
      if (searchEl){
        searchEl.addEventListener("input", function(e){
          tutorSearch = e.target.value;
          var caret = e.target.selectionStart;
          render();
          var el = document.getElementById("tutorSearch");
          if (el){ el.focus(); el.setSelectionRange(caret, caret); }
        });
      }
      Array.prototype.forEach.call(document.querySelectorAll(".station-card"), function(btn){
        btn.addEventListener("click", function(){ openTutorTopic(btn.getAttribute("data-kind"), btn.getAttribute("data-key")); });
      });
      return;
    }

    var script = getTutorScript(tutorCurrent.kind, tutorCurrent.key);
    if (!script){ tutorCurrent = null; renderTutor(); return; }

    var letters3 = ["A","B","C","D"];
    var bubblesHtml = '<div class="tutor-bubble hook">'+highlightAbbrev(esc(script.hook))+'</div>';
    script.sections.forEach(function(sec, i){
      bubblesHtml += '<div class="tutor-section-head">'+esc(sec.heading)+'</div>';
      sec.beats.forEach(function(b){
        bubblesHtml += '<div class="tutor-bubble">'+highlightAbbrev(esc(b))+'</div>';
      });
      var qs = tutorQuizState[i];
      if (qs){
        var qq = qs.question;
        var optsHtml = qq.o.map(function(opt, oi){
          var state_ = "";
          if (qs.answered){
            if (oi===qq.a) state_ = "correct";
            else if (oi===qs.chosen) state_ = "incorrect";
          }
          var whyHtml = (qs.answered && qq.why && qq.why[oi]) ? '<div class="opt-why '+(oi===qq.a?'opt-why-correct':'opt-why-wrong')+'">'+highlightAbbrev(esc(qq.why[oi]))+'</div>' : '';
          return '<div class="option-wrap"><button class="option quiz-opt" data-section="'+i+'" data-i="'+oi+'" '+(qs.answered?'disabled':'')+(state_?' data-state="'+state_+'"':'')+'>'+
            '<span class="letter">'+letters3[oi]+'</span><span>'+highlightAbbrev(esc(opt))+'</span></button>'+whyHtml+'</div>';
        }).join("");
        bubblesHtml += '<div class="quiz-card"><div class="quiz-badge">🧠 Quick check</div><div class="quiz-stem">'+highlightAbbrev(esc(qq.q))+'</div><div class="options">'+optsHtml+'</div>'+
          (qs.answered ? '<div class="footnote" style="margin-top:10px;">'+highlightAbbrev(esc(qq.r))+'</div>' : '')+
          '</div>';
      }
    });
    bubblesHtml += '<div class="tutor-bubble recap">'+highlightAbbrev(esc(script.recap))+'</div>';

    document.getElementById("main").innerHTML =
      '<div class="pagehead"><button class="btn btn-ghost btn-sm" id="backTutorTopic" style="margin-bottom:10px;">&larr; '+esc((TUTOR_CATEGORIES.filter(function(c){return c.key===tutorCategory;})[0]||{}).label||"All topics")+'</button>'+
        '<h1>'+esc(script.title)+'</h1>'+
        '<div style="margin-top:6px;">'+listenBtnHtml("tutor:"+tutorCurrent.kind+":"+tutorCurrent.key, "Listen to this lesson")+'</div>'+
      '</div>'+
      '<div class="tutor-conv">'+bubblesHtml+'</div>';

    document.getElementById("backTutorTopic").addEventListener("click", closeTutorTopic);
    Array.prototype.forEach.call(document.querySelectorAll(".quiz-opt"), function(btn){
      btn.addEventListener("click", function(){
        answerTutorQuiz(parseInt(btn.getAttribute("data-section"),10), parseInt(btn.getAttribute("data-i"),10));
      });
    });

    var tutorBlocks = [script.hook];
    var letters4 = ["A","B","C","D"];
    script.sections.forEach(function(sec, i){
      tutorBlocks.push(sec.heading+".");
      sec.beats.forEach(function(b){ tutorBlocks.push(b); });
      var qs = tutorQuizState[i];
      if (qs && qs.answered){
        var qq = qs.question;
        tutorBlocks.push("Quick check: "+qq.q);
        qq.o.forEach(function(opt,oi){ tutorBlocks.push("Option "+letters4[oi]+": "+opt+"."); });
        var wasRight = qs.chosen===qq.a;
        tutorBlocks.push(narratorLine(wasRight ? NARRATOR_RIGHT : NARRATOR_WRONG));
        tutorBlocks.push(wasRight ? "You answered correctly." : "The correct answer is option "+letters4[qq.a]+".");
        tutorBlocks.push(qq.r);
        if (qq.why){
          tutorBlocks.push(narratorLine(NARRATOR_BREAKDOWN));
          qq.why.forEach(function(w,oi){ if (w) tutorBlocks.push("Option "+letters4[oi]+": "+w); });
        }
      }
    });
    tutorBlocks.push(script.recap);
    var tKey = "tutor:"+tutorCurrent.kind+":"+tutorCurrent.key;
    var tSrcMap = {};
    tSrcMap[tKey] = {title:script.title, blocks:tutorBlocks};
    wireListenBtns(tSrcMap);
  }

  function renderRxAbbrev(){
    var q = abbrevSearch.trim().toLowerCase();
    var allCats = RX_ABBREV.concat([{cat:"Clinical & drug-class abbreviations", items:GLOSSARY}]);
    var filteredCats = allCats.map(function(cat){
      var items = !q ? cat.items : cat.items.filter(function(it){
        return it.a.toLowerCase().indexOf(q)!==-1 || it.m.toLowerCase().indexOf(q)!==-1;
      });
      return {cat:cat.cat, items:items};
    }).filter(function(cat){ return cat.items.length>0; });

    var catsHtml = filteredCats.map(function(cat){
      return '<div class="panel"><h2>'+esc(cat.cat)+'</h2>'+
        '<div class="abbrev-grid" style="margin-top:12px;">'+cat.items.map(function(it){
          return '<div class="abbrev-item"><div class="a-code">'+esc(it.a)+'</div><div class="a-mean">'+esc(it.m)+'</div></div>';
        }).join("")+'</div></div>';
    }).join("");

    var dangerHtml = RX_ABBREV_DANGER.map(function(d){
      return '<div class="danger-row">'+
        '<div class="d-bad">'+esc(d.bad)+'</div>'+
        '<div class="d-why">'+esc(d.why)+'</div>'+
        '<div class="d-fix">Instead: '+esc(d.fix)+'</div>'+
      '</div>';
    }).join("");

    document.getElementById("main").innerHTML =
      refBackBtn("Abbreviations")+
      '<div class="panel" style="margin-bottom:16px;">'+
        '<input type="text" class="textinput" id="abbrevSearch" placeholder="Search an abbreviation (e.g. ACEi, BID, CrCl)…" value="'+esc(abbrevSearch)+'" style="width:100%;">'+
      '</div>'+
      (q ? '' :
      '<div class="panel" style="border-color:var(--danger);">'+
        '<h2 style="color:var(--danger);">⚠ ISMP Canada "Do Not Use" list</h2>'+
        '<p style="color:var(--text-muted); font-size:0.86rem; margin:4px 0 14px;">These abbreviations are common exam trap questions — they look convenient but have caused real dispensing errors.</p>'+
        dangerHtml+
      '</div>')+
      (catsHtml || '<div class="panel"><p class="empty">No abbreviation matches — try a different search.</p></div>')+
      '<p class="footnote">Reference only — always follow your provincial college\'s current prescription-labelling standards. Clinical abbreviations here are also what get auto-highlighted (tap for the full term) in Study Guides.</p>';
    wireRefBack();
    document.getElementById("abbrevSearch").addEventListener("input", function(e){
      abbrevSearch = e.target.value;
      var caret = e.target.selectionStart;
      render();
      var el = document.getElementById("abbrevSearch");
      if (el){ el.focus(); el.setSelectionRange(caret, caret); }
    });
  }

  function buildKrollDiagram(){
    var stages = [
      "Rx Received\n(fax / e-Rx / verbal / transfer-in)",
      "Patient Profile\ncheck / update",
      "Data Entry\ndrug, DIN, Sig",
      "Clinical Check\nDUR, interactions, allergy",
      "Adjudication\ninsurance claim",
      "Fill & Label\nbatch / blister / compound",
      "RPh Verify\nbarcode scan",
      "Counsel & Bill\npickup, documentation"
    ];
    var bw=150, bh=74, gap=22, y=54;
    var svgW = stages.length*bw + (stages.length-1)*gap;
    var boxes = "", arrows = "";
    stages.forEach(function(label, i){
      var x = i*(bw+gap);
      var lines = label.split("\n");
      boxes += '<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="10" fill="var(--bg-elevated)" stroke="var(--accent)" stroke-width="1.5"></rect>';
      boxes += '<text x="'+(x+bw/2)+'" y="'+(y+30)+'" text-anchor="middle" font-size="12" font-weight="700" fill="var(--text)">'+esc(lines[0])+'</text>';
      boxes += '<text x="'+(x+bw/2)+'" y="'+(y+48)+'" text-anchor="middle" font-size="10.5" fill="var(--text-muted)">'+esc(lines[1]||"")+'</text>';
      if (i < stages.length-1){
        var ax = x+bw, ax2 = x+bw+gap;
        arrows += '<line x1="'+ax+'" y1="'+(y+bh/2)+'" x2="'+(ax2-6)+'" y2="'+(y+bh/2)+'" stroke="var(--gold)" stroke-width="2" marker-end="url(#krollArrow)"></line>';
      }
    });
    return '<div class="kroll-diagram-wrap"><svg viewBox="0 0 '+svgW+' 170" xmlns="http://www.w3.org/2000/svg">'+
      '<defs><marker id="krollArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--gold)"></path></marker></defs>'+
      arrows+boxes+
    '</svg></div>';
  }

  function renderKrollOps(){
    var opsHtml;
    if (krollOpen==null){
      opsHtml = '<div class="panel">'+KROLL_OPS.map(function(op){
        return '<div class="kroll-card" data-op="'+op.n+'"><div class="k-head"><span class="k-num">'+op.n+'</span><span class="k-title">'+esc(op.title)+'</span></div></div>';
      }).join("")+'</div>';
    } else {
      var op = KROLL_OPS.filter(function(o){ return o.n===krollOpen; })[0];
      opsHtml = '<div class="panel">'+
        '<button class="btn btn-ghost btn-sm" id="backKrollList" style="margin-bottom:10px;">&larr; All 15 operations</button>'+
        '<h2>'+op.n+'. '+esc(op.title)+'</h2>'+
        '<ol class="kroll-steps">'+op.steps.map(function(s){ return '<li>'+esc(s)+'</li>'; }).join("")+'</ol>'+
      '</div>';
    }

    document.getElementById("main").innerHTML =
      refBackBtn("Kroll workflow — top 15 operations")+
      '<div class="panel">'+
        '<h2>End-to-end prescription flow</h2>'+
        '<p style="color:var(--text-muted); font-size:0.86rem; margin:4px 0 14px;">Most of the 15 operations below slot into this core lifecycle. Scroll sideways on small screens.</p>'+
        buildKrollDiagram()+
      '</div>'+
      opsHtml+
      '<p class="footnote">General Kroll/Canadian-PMS workflow, based on Kroll\'s publicly documented feature set (TELUS Health) — not a certified user manual. Exact menu paths vary by version and pharmacy configuration; use your store\'s own Kroll training for click-by-click navigation.</p>';

    wireRefBack();
    var backList = document.getElementById("backKrollList");
    if (backList) backList.addEventListener("click", function(){ krollOpen = null; render(); });
    Array.prototype.forEach.call(document.querySelectorAll(".kroll-card"), function(card){
      card.addEventListener("click", function(){ krollOpen = parseInt(card.getAttribute("data-op"),10); render(); window.scrollTo(0,0); });
    });
  }

  /* ---------------- Render: Drug Reference ---------------- */
  function renderDrugs(){
    var availableTopics = [];
    var seenTopics = {};
    DRUGS.forEach(function(d){
      if (!seenTopics[d.topic]){ seenTopics[d.topic] = true; availableTopics.push(d.topic); }
    });
    availableTopics.sort(function(a,b){ return topicLabel(a).localeCompare(topicLabel(b)); });

    var filterOptions = '<option value="all">All topics</option>' + availableTopics.map(function(t){
      return '<option value="'+t+'"'+(drugFilter===t?' selected':'')+'>'+esc(topicLabel(t))+'</option>';
    }).join("");

    var q = drugSearch.trim().toLowerCase();
    var list = DRUGS.filter(function(d){
      if (drugFilter!=="all" && d.topic!==drugFilter) return false;
      if (!q) return true;
      var hay = (d.generic+" "+(d.brand||[]).join(" ")+" "+d.class).toLowerCase();
      return hay.indexOf(q) !== -1;
    }).sort(function(a,b){ return a.generic.localeCompare(b.generic); });

    var cardsHtml = list.map(function(d, i){
      var id = "drug_"+d.topic+"_"+i;
      var open = drugOpenId === id;
      var brandStr = (d.brand||[]).length ? (d.brand||[]).join(", ") : "Generic only";
      var body = open ? (
        '<div class="drug-card-body">'+
          '<div style="margin-bottom:10px;">'+listenBtnHtml("drug:"+id,"Listen to this drug")+'</div>'+
          '<div class="drug-section"><h4>Pharmacology</h4><p>'+highlightAbbrev(esc(d.moa))+'</p></div>'+
          '<div class="drug-section"><h4>Main indication</h4><p>'+highlightAbbrev(esc(d.indication))+'</p></div>'+
          '<div class="drug-section"><h4>Typical adult dosage</h4><p>'+highlightAbbrev(esc(d.dosage))+'</p></div>'+
          '<div class="drug-section"><h4>Exam must-knows</h4><ul>'+(d.examPoints||[]).map(function(x){ return '<li>'+highlightAbbrev(esc(x))+'</li>'; }).join("")+'</ul></div>'+
          '<div class="drug-section"><h4>Counselling the patient</h4><ul>'+(d.counselling||[]).map(function(x){ return '<li>'+highlightAbbrev(esc(x))+'</li>'; }).join("")+'</ul></div>'+
          '<div class="drug-section"><h4>Main side effects</h4><ul>'+(d.sideEffects||[]).map(function(x){ return '<li>'+highlightAbbrev(esc(x))+'</li>'; }).join("")+'</ul></div>'+
        '</div>'
      ) : '';
      var speakIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 9 3 15 8 15 13 20 13 4 8 9 3 9"></polygon><path d="M15.5 8.5a5 5 0 0 1 0 7"></path></svg>';
      var pron = d.pronunciation ?
        '<button type="button" class="drug-pronunciation" data-generic="'+esc(d.generic)+'" aria-label="Play pronunciation of '+esc(d.generic)+'">'+esc(d.pronunciation)+' '+speakIcon+'</button>'
        : '';
      return '<div class="drug-card">'+
        '<div class="drug-card-head" data-id="'+id+'" role="button" tabindex="0">'+
          '<span><span class="drug-name">'+esc(d.generic)+'</span>'+pron+'<div class="drug-brand">'+esc(brandStr)+' · '+esc(d.class)+'</div></span>'+
          '<span class="badge badge-accent">'+esc(topicLabel(d.topic))+'</span>'+
        '</div>'+body+
      '</div>';
    }).join("");

    document.getElementById("main").innerHTML =
      '<div class="pagehead"><h1>Drug reference</h1><p>Generic &amp; brand names, pharmacology, main indication, exam must-knows, patient counselling, and main side effects. Tap a drug to expand it.</p></div>'+
      '<div class="panel" style="margin-bottom:16px;">'+
        '<div class="field-row">'+
          '<input type="text" class="textinput" id="drugSearch" placeholder="Search by generic or brand name…" value="'+esc(drugSearch)+'">'+
          '<select class="select" id="drugTopicSelect">'+filterOptions+'</select>'+
        '</div>'+
      '</div>'+
      (list.length ?
        '<div class="drug-list">'+cardsHtml+'</div>'
        : '<div class="panel"><p class="empty">No drugs match — try a different search or topic.</p></div>')+
      '<p class="footnote">Coverage is still growing topic by topic — this list will keep expanding. Educational reference content, not a substitute for the full product monograph.</p>';

    document.getElementById("drugSearch").addEventListener("input", function(e){
      drugSearch = e.target.value;
      var caret = e.target.selectionStart;
      render();
      var el = document.getElementById("drugSearch");
      if (el){ el.focus(); el.setSelectionRange(caret, caret); }
    });
    document.getElementById("drugTopicSelect").addEventListener("change", function(e){
      drugFilter = e.target.value; render();
    });
    Array.prototype.forEach.call(document.querySelectorAll(".drug-card-head"), function(el){
      var toggle = function(){
        var id = el.getAttribute("data-id");
        drugOpenId = (drugOpenId===id) ? null : id;
        render();
      };
      el.addEventListener("click", toggle);
      el.addEventListener("keydown", function(e){
        if (e.key==="Enter" || e.key===" "){ e.preventDefault(); toggle(); }
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".drug-pronunciation"), function(btn){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        speakDrugName(btn.getAttribute("data-generic"), btn);
      });
    });
    if (drugOpenId){
      var openDrug = list.filter(function(d,i){ return ("drug_"+d.topic+"_"+i)===drugOpenId; })[0];
      if (openDrug){
        var drugBlocks = [
          "Pharmacology: "+openDrug.moa,
          "Main indication: "+openDrug.indication,
          "Typical adult dosage: "+openDrug.dosage,
          "Exam must-knows."
        ].concat(openDrug.examPoints||[])
         .concat(["Counselling the patient."]).concat(openDrug.counselling||[])
         .concat(["Main side effects."]).concat(openDrug.sideEffects||[]);
        var drugSrcMap = {};
        drugSrcMap["drug:"+drugOpenId] = {title:openDrug.generic, blocks:drugBlocks};
        wireListenBtns(drugSrcMap);
      }
    }
  }

  /* ---------------- Render: History ---------------- */
  function renderHistory(){
    var rows = [];
    state.mcqAttempts.forEach(function(a){
      rows.push({ts:a.ts, type:"MCQ", detail:topicLabel(a.topic), result:a.correct});
    });
    state.osceAttempts.forEach(function(a){
      rows.push({ts:a.ts, type:"OSCE", detail:a.title, result:a.score+"%"});
    });
    rows.sort(function(a,b){ return b.ts-a.ts; });

    var tableRows = rows.map(function(r){
      var resultHtml;
      if (r.type==="MCQ"){
        resultHtml = '<span class="pill '+(r.result?'pill-correct':'pill-incorrect')+'">'+(r.result?'Correct':'Incorrect')+'</span>';
      } else {
        resultHtml = '<span class="pill pill-osce">'+r.result+'</span>';
      }
      return '<tr><td class="tnum" style="color:var(--text-muted);">'+fmtDate(r.ts)+'</td>'+
        '<td>'+r.type+'</td><td>'+esc(r.detail)+'</td><td>'+resultHtml+'</td></tr>';
    }).join("");

    document.getElementById("main").innerHTML =
      '<div class="pagehead"><h1>History</h1><p>Every MCQ and OSCE self-assessment logged in this browser.</p></div>'+
      (rows.length ?
        '<div class="panel"><div class="hist-scroll"><table class="hist-table">'+
          '<thead><tr><th>When</th><th>Type</th><th>Item</th><th>Result</th></tr></thead>'+
          '<tbody>'+tableRows+'</tbody></table></div></div>'
        : '<div class="panel"><p class="empty">No activity yet — head to MCQ Practice or OSCE Stations to get started.</p></div>');
  }

  /* ---------------- Main render ---------------- */
  function render(){
    renderRail();
    if (view==="dashboard") renderDashboard();
    else if (view==="mcq") renderMcq();
    else if (view==="osce") renderOsce();
    else if (view==="study") renderStudyGuides();
    else if (view==="drugs") renderDrugs();
    else if (view==="schedules") renderDrugSchedules();
    else if (view==="calc") renderCalculations();
    else if (view==="classes") renderDrugClasses();
    else if (view==="juris") renderJuris();
    else if (view==="tutor") renderTutor();
    else if (view==="ref") renderReference();
    else if (view==="history") renderHistory();
  }

  /* Delegated abbreviation-tap handler — works for any .abbr-term inserted anywhere in #main, on every render. */
  (function(){
    var mainEl = document.getElementById("main");
    function findAbbr(el){
      while (el && el !== mainEl){
        if (el.classList && el.classList.contains("abbr-term")) return el;
        el = el.parentElement;
      }
      return null;
    }
    mainEl.addEventListener("click", function(e){
      var el = findAbbr(e.target);
      if (!el) return;
      e.stopPropagation();
      toast(el.textContent + " — " + el.getAttribute("data-full"));
    });
    mainEl.addEventListener("keydown", function(e){
      if (e.key!=="Enter" && e.key!==" ") return;
      var el = findAbbr(e.target);
      if (!el) return;
      e.preventDefault(); e.stopPropagation();
      toast(el.textContent + " — " + el.getAttribute("data-full"));
    });
  })();

  render();
})();
</script>
