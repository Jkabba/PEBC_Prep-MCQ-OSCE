<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEBC Prep — MCQ &amp; OSCE Simulator</title>
<style>
  :root{
    --bg:#F1F4EE;
    --bg-elevated:#FFFFFF;
    --surface-2:#E6EAE0;
    --border:#D3DAC9;
    --text:#16231C;
    --text-muted:#4E5C51;
    --accent:#1F5449;
    --accent-soft:#DCE8E1;
    --accent-contrast:#FFFFFF;
    --gold:#96691C;
    --gold-soft:#F1E3C6;
    --success:#2E7D5B;
    --success-soft:#DCEEE3;
    --danger:#A9463C;
    --danger-soft:#F5DEDA;
    --info:#35678A;
    --info-soft:#DCE8F0;
    --shadow:rgba(23,35,28,0.10);
    --font-display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:ui-monospace,"SF Mono","Cascadia Code","Roboto Mono",Consolas,monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0F1713;
      --bg-elevated:#17211C;
      --surface-2:#1E2921;
      --border:#2B382F;
      --text:#E7EDE6;
      --text-muted:#9FB2A4;
      --accent:#59B092;
      --accent-soft:#1D372C;
      --accent-contrast:#08150F;
      --gold:#E0AC55;
      --gold-soft:#3A2E17;
      --success:#57B98D;
      --success-soft:#1B3226;
      --danger:#E28B7D;
      --danger-soft:#3A211C;
      --info:#82B7DA;
      --info-soft:#1C2C38;
      --shadow:rgba(0,0,0,0.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1713; --bg-elevated:#17211C; --surface-2:#1E2921; --border:#2B382F;
    --text:#E7EDE6; --text-muted:#9FB2A4; --accent:#59B092; --accent-soft:#1D372C;
    --accent-contrast:#08150F; --gold:#E0AC55; --gold-soft:#3A2E17; --success:#57B98D;
    --success-soft:#1B3226; --danger:#E28B7D; --danger-soft:#3A211C; --info:#82B7DA;
    --info-soft:#1C2C38; --shadow:rgba(0,0,0,0.5); color-scheme: dark;
  }
  :root[data-theme="light"]{
    --bg:#F1F4EE; --bg-elevated:#FFFFFF; --surface-2:#E6EAE0; --border:#D3DAC9;
    --text:#16231C; --text-muted:#4E5C51; --accent:#1F5449; --accent-soft:#DCE8E1;
    --accent-contrast:#FFFFFF; --gold:#96691C; --gold-soft:#F1E3C6; --success:#2E7D5B;
    --success-soft:#DCEEE3; --danger:#A9463C; --danger-soft:#F5DEDA; --info:#35678A;
    --info-soft:#DCE8F0; --shadow:rgba(23,35,28,0.10); color-scheme: light;
  }

  *{box-sizing:border-box;}
  body{margin:0;}
  #pebc-app{
    font-family:var(--font-body);
    color:var(--text);
    background:var(--bg);
    min-height:100%;
    line-height:1.5;
  }
  #pebc-app *{ min-width:0; }
  #pebc-app :focus-visible{
    outline:2.5px solid var(--gold);
    outline-offset:2px;
    border-radius:4px;
  }
  #pebc-app h1,#pebc-app h2,#pebc-app h3{
    font-family:var(--font-display);
    text-wrap:balance;
    margin:0;
    font-weight:600;
  }
  #pebc-app button{ font-family:inherit; }
  #pebc-app .tnum{ font-variant-numeric:tabular-nums; font-family:var(--font-mono); }

  .shell{
    display:grid;
    grid-template-columns:248px 1fr;
    min-height:640px;
  }
  @media (max-width:820px){
    .shell{ grid-template-columns:1fr; }
  }

  /* ---- Rail ---- */
  .rail{
    background:var(--bg-elevated);
    border-right:1px solid var(--border);
    padding:22px 18px 18px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }
  @media (max-width:820px){
    .rail{
      border-right:none;
      border-bottom:1px solid var(--border);
      flex-direction:row;
      align-items:center;
      flex-wrap:wrap;
      padding:14px 16px;
      gap:12px;
    }
  }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand .mark{
    font-family:var(--font-display);
    font-size:1.28rem;
    letter-spacing:0.01em;
    color:var(--accent);
  }
  .brand .tag{
    font-size:0.72rem;
    color:var(--text-muted);
    letter-spacing:0.03em;
  }
  @media (max-width:820px){ .brand{ margin-right:auto; } }

  .navlist{ display:flex; flex-direction:column; gap:4px; }
  @media (max-width:820px){ .navlist{ flex-direction:row; flex-wrap:wrap; } }
  .navbtn{
    display:flex; align-items:center; gap:10px;
    padding:9px 11px;
    border-radius:8px;
    border:1px solid transparent;
    background:transparent;
    color:var(--text-muted);
    font-size:0.92rem;
    font-weight:600;
    cursor:pointer;
    text-align:left;
  }
  .navbtn:hover{ background:var(--surface-2); color:var(--text); }
  .navbtn[aria-current="true"]{
    background:var(--accent-soft);
    color:var(--accent);
    border-color:var(--accent-soft);
  }
  .navbtn .dot{
    width:7px; height:7px; border-radius:50%;
    background:currentColor; opacity:0.55; flex:none;
  }

  .rail-stats{
    margin-top:auto;
    border-top:1px solid var(--border);
    padding-top:16px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  @media (max-width:820px){ .rail-stats{ display:none; } }
  .rail-stat-row{ display:flex; justify-content:space-between; align-items:baseline; }
  .rail-stat-label{ font-size:0.74rem; color:var(--text-muted); }
  .rail-stat-value{ font-size:0.95rem; font-weight:700; }

  /* ---- Main ---- */
  .main{ padding:26px 30px 60px; max-width:820px; }
  @media (max-width:820px){ .main{ padding:20px 18px 50px; } }

  .pagehead{ margin-bottom:22px; }
  .pagehead h1{ font-size:1.5rem; }
  .pagehead p{ margin:5px 0 0; color:var(--text-muted); font-size:0.92rem; max-width:60ch; }

  .cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:12px;
    margin-bottom:26px;
  }
  .stat-card{
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 16px;
    box-shadow:0 1px 2px var(--shadow);
  }
  .stat-card .label{ font-size:0.72rem; color:var(--text-muted); letter-spacing:0.03em; text-transform:uppercase; }
  .stat-card .value{ font-family:var(--font-mono); font-size:1.5rem; font-weight:600; margin-top:4px; font-variant-numeric:tabular-nums; }
  .stat-card .sub{ font-size:0.76rem; color:var(--text-muted); margin-top:2px; }

  .panel{
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:14px;
    padding:22px;
    box-shadow:0 1px 3px var(--shadow);
    margin-bottom:20px;
  }
  .panel h2{ font-size:1.08rem; margin-bottom:4px; }
  .panel + .panel{ margin-top:0; }

  .topicbars{ display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .topicbar-row{ display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; font-size:0.86rem; }
  .topicbar-track{
    grid-column:1 / -1;
    height:7px; border-radius:4px; background:var(--surface-2); overflow:hidden;
  }
  .topicbar-fill{ height:100%; background:var(--accent); border-radius:4px; }
  .topicbar-name{ font-weight:600; }
  .topicbar-pct{ font-family:var(--font-mono); color:var(--text-muted); font-variant-numeric:tabular-nums; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border-radius:9px; border:1px solid var(--border);
    background:var(--bg-elevated); color:var(--text);
    font-size:0.9rem; font-weight:600; padding:10px 16px;
    cursor:pointer;
  }
  .btn:hover{ background:var(--surface-2); }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-contrast); }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-ghost{ background:transparent; border-color:transparent; color:var(--text-muted); }
  .btn-ghost:hover{ background:var(--surface-2); color:var(--text); }
  .btn-sm{ padding:6px 11px; font-size:0.8rem; border-radius:7px; }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
  .btn[disabled]{ opacity:0.5; cursor:not-allowed; }

  select.select{
    font-family:inherit; font-size:0.86rem; padding:8px 10px;
    border-radius:8px; border:1px solid var(--border);
    background:var(--bg-elevated); color:var(--text);
  }

  .badge{
    display:inline-flex; align-items:center; gap:6px;
    font-size:0.72rem; font-weight:700; letter-spacing:0.03em; text-transform:uppercase;
    padding:3px 9px; border-radius:100px;
    background:var(--surface-2); color:var(--text-muted);
  }
  .badge-accent{ background:var(--accent-soft); color:var(--accent); }
  .badge-gold{ background:var(--gold-soft); color:var(--gold); }

  /* ---- MCQ ---- */
  .q-meta{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px; flex-wrap:wrap; }
  .q-stem{ font-size:1.05rem; line-height:1.55; margin-bottom:18px; }
  .options{ display:flex; flex-direction:column; gap:10px; }
  .option{
    display:flex; align-items:flex-start; gap:12px;
    text-align:left;
    border:1px solid var(--border); border-radius:10px;
    background:var(--bg-elevated);
    padding:12px 14px;
    cursor:pointer;
    font-size:0.94rem;
  }
  .option:hover{ background:var(--surface-2); }
  .option .letter{
    flex:none; width:24px; height:24px; border-radius:50%;
    background:var(--surface-2); color:var(--text-muted);
    display:flex; align-items:center; justify-content:center;
    font-size:0.76rem; font-weight:700; font-family:var(--font-mono);
  }
  .option[data-state="correct"]{ background:var(--success-soft); border-color:var(--success); }
  .option[data-state="correct"] .letter{ background:var(--success); color:#fff; }
  .option[data-state="incorrect"]{ background:var(--danger-soft); border-color:var(--danger); }
  .option[data-state="incorrect"] .letter{ background:var(--danger); color:#fff; }
  .option[disabled]{ cursor:default; }
  .option-wrap{ display:flex; flex-direction:column; gap:4px; }
  .opt-why{ font-size:0.83rem; line-height:1.5; padding:8px 14px 8px 46px; border-radius:0 0 10px 10px; margin-top:-10px; }
  .opt-why-correct{ background:var(--success-soft); color:var(--text); }
  .opt-why-wrong{ background:var(--surface-2); color:var(--text-muted); }
  .trap-flag{ display:inline-flex; align-items:center; gap:4px; font-size:0.72rem; font-weight:700; color:var(--gold); background:var(--gold-soft); border-radius:6px; padding:3px 8px; }

  .feedback{
    margin-top:18px; padding:16px; border-radius:10px;
    border:1px solid var(--border); background:var(--surface-2);
  }
  .feedback .verdict{ font-weight:700; margin-bottom:6px; }
  .feedback.correct .verdict{ color:var(--success); }
  .feedback.incorrect .verdict{ color:var(--danger); }
  .feedback .rationale{ font-size:0.92rem; color:var(--text); }
  .feedback .mnemonic{
    margin-top:10px; padding-top:10px; border-top:1px dashed var(--border);
    font-size:0.86rem; color:var(--gold); font-style:italic;
  }

  /* ---- OSCE ---- */
  .station-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; }
  .station-card{
    text-align:left; border:1px solid var(--border); border-radius:12px;
    background:var(--bg-elevated); padding:15px; cursor:pointer;
  }
  .station-card:hover{ background:var(--surface-2); }
  .station-card .st-title{ font-weight:700; font-size:0.95rem; margin-bottom:6px; }
  .station-card .st-blurb{ font-size:0.8rem; color:var(--text-muted); }
  .station-card .st-foot{ margin-top:10px; display:flex; justify-content:space-between; align-items:center; }

  .timer-box{
    display:flex; align-items:center; gap:10px;
    background:var(--surface-2); border-radius:10px; padding:8px 14px;
    width:fit-content;
  }
  .timer-box .clock{ font-family:var(--font-mono); font-size:1.3rem; font-weight:700; font-variant-numeric:tabular-nums; }

  .scenario-box{
    background:var(--surface-2); border-radius:10px; padding:16px; margin:16px 0;
    font-size:0.95rem; line-height:1.6;
  }
  .task-box{
    background:var(--accent-soft); color:var(--accent); border-radius:10px;
    padding:12px 16px; font-size:0.9rem; font-weight:600; margin-bottom:16px;
  }
  textarea.notes{
    width:100%; min-height:110px; border-radius:10px; border:1px solid var(--border);
    background:var(--bg-elevated); color:var(--text); font-family:inherit; font-size:0.9rem;
    padding:12px; resize:vertical;
  }

  .checklist{ display:flex; flex-direction:column; gap:9px; margin:14px 0; }
  .check-item{ display:flex; align-items:flex-start; gap:10px; font-size:0.9rem; }
  .check-item input{ margin-top:3px; flex:none; width:16px; height:16px; accent-color:var(--accent); }

  .score-ring-wrap{ display:flex; align-items:center; gap:16px; margin:12px 0; }
  .score-ring{ width:64px; height:64px; border-radius:50%; flex:none;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-weight:700; font-size:0.95rem;
    background:conic-gradient(var(--accent) calc(var(--pct,0)*1%), var(--surface-2) 0);
  }
  .score-ring::before{
    content:""; position:relative;
  }
  .score-ring .inner{
    width:48px; height:48px; border-radius:50%; background:var(--bg-elevated);
    display:flex; align-items:center; justify-content:center;
  }

  /* ---- OSCE official-format additions ---- */
  .format-badge{ font-size:0.68rem; text-transform:uppercase; letter-spacing:0.03em; font-weight:700; padding:2px 8px; border-radius:6px; }
  .format-badge.patient{ background:var(--info-soft); color:var(--info); }
  .format-badge.hp{ background:var(--gold-soft); color:var(--gold); }
  .format-badge.screen-rx, .format-badge.check-meds{ background:var(--surface-2); color:var(--text-muted); }
  .osce-meta-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  .competency-card{ border:1px solid var(--border); border-radius:10px; padding:10px 14px; margin-bottom:8px; background:var(--bg-elevated); }
  .competency-card .code{ display:inline-block; font-family:var(--font-mono); font-weight:700; color:var(--accent); margin-right:8px; }
  .competency-card ul{ margin:6px 0 0; padding-left:18px; font-size:0.85rem; color:var(--text-muted); }
  .participant-panel{ border:1px solid var(--info); border-radius:10px; padding:14px 16px; margin-bottom:12px; background:var(--info-soft); }
  .participant-panel h3{ font-size:0.92rem; margin-bottom:6px; }
  .participant-line{ font-style:italic; padding:8px 12px; border-left:3px solid var(--info); margin:8px 0; font-size:0.9rem; background:var(--bg-elevated); border-radius:0 8px 8px 0; }
  .response-cue{ font-size:0.76rem; color:var(--text-muted); margin-top:8px; }
  .assessor-tiers{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; margin:10px 0; }
  .assessor-tier{ border-radius:10px; padding:10px 12px; font-size:0.82rem; }
  .assessor-tier h4{ font-size:0.74rem; text-transform:uppercase; letter-spacing:0.03em; margin-bottom:6px; }
  .assessor-tier ul{ margin:0; padding-left:16px; line-height:1.5; }
  .assessor-tier.solved{ background:var(--success-soft); } .assessor-tier.solved h4{ color:var(--success); }
  .assessor-tier.marginal{ background:var(--info-soft); } .assessor-tier.marginal h4{ color:var(--info); }
  .assessor-tier.uncertain{ background:var(--gold-soft); } .assessor-tier.uncertain h4{ color:var(--gold); }
  .assessor-tier.unsolved{ background:var(--danger-soft); } .assessor-tier.unsolved h4{ color:var(--danger); }
  .rating-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .rating-row .rating-label{ font-size:0.85rem; font-weight:600; min-width:130px; }
  .rating-pill{ border:1px solid var(--border); background:var(--bg-elevated); border-radius:20px; padding:5px 12px; font-size:0.78rem; cursor:pointer; }
  .rating-pill[data-active="1"]{ background:var(--accent); color:var(--accent-contrast); border-color:var(--accent); }
  .rx-item-card{ border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:12px; background:var(--bg-elevated); }
  .rx-item-card .rx-label{ font-weight:700; margin-bottom:4px; }
  .rx-item-card .rx-detail{ font-family:var(--font-mono); font-size:0.86rem; background:var(--surface-2); padding:8px 10px; border-radius:6px; margin-bottom:10px; }
  .rx-item-card .rx-answer{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); font-size:0.86rem; }

  /* ---- History ---- */
  .hist-table{ width:100%; border-collapse:collapse; font-size:0.85rem; }
  .hist-table th{
    text-align:left; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.03em;
    color:var(--text-muted); border-bottom:1px solid var(--border); padding:8px 6px;
  }
  .hist-table td{ padding:9px 6px; border-bottom:1px solid var(--border); }
  .hist-scroll{ overflow-x:auto; }
  .pill{
    display:inline-block; padding:2px 9px; border-radius:100px; font-size:0.72rem; font-weight:700;
  }
  .pill-correct{ background:var(--success-soft); color:var(--success); }
  .pill-incorrect{ background:var(--danger-soft); color:var(--danger); }
  .pill-osce{ background:var(--info-soft); color:var(--info); }

  .empty{
    text-align:center; color:var(--text-muted); padding:40px 20px; font-size:0.9rem;
  }

  .toast{
    position:fixed; bottom:20px; right:20px; background:var(--text); color:var(--bg);
    padding:10px 16px; border-radius:9px; font-size:0.85rem; box-shadow:0 4px 14px var(--shadow);
    opacity:0; transform:translateY(6px); transition:opacity .2s, transform .2s; pointer-events:none;
    z-index:50;
  }
  .toast.show{ opacity:1; transform:translateY(0); }

  @media (prefers-reduced-motion: reduce){
    #pebc-app *{ transition:none !important; }
  }

  /* ---- Drug reference ---- */
  input.textinput{
    font-family:inherit; font-size:0.86rem; padding:9px 12px;
    border-radius:8px; border:1px solid var(--border);
    background:var(--bg-elevated); color:var(--text); flex:1; min-width:180px;
  }
  .drug-list{ display:flex; flex-direction:column; gap:10px; }
  .drug-card{
    border:1px solid var(--border); border-radius:12px; background:var(--bg-elevated);
    overflow:hidden;
  }
  .drug-card-head{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:14px 16px; cursor:pointer; text-align:left; width:100%; background:none; border:none; font-family:inherit;
  }
  .drug-card-head:hover{ background:var(--surface-2); }
  .drug-name{ font-weight:700; font-size:0.98rem; color:var(--text); }
  .drug-pronunciation{
    display:inline-flex; align-items:center; gap:4px;
    font-size:0.8rem; color:var(--text-muted); font-style:italic; margin-left:6px;
    background:none; border:none; padding:0; font-family:inherit; cursor:pointer;
  }
  .drug-pronunciation:hover, .drug-pronunciation:focus-visible{ color:var(--accent); }
  .drug-pronunciation svg{ width:12px; height:12px; flex:none; }
  .drug-pronunciation[data-playing="true"]{ color:var(--accent); }
  .drug-brand{ font-size:0.8rem; color:var(--text-muted); margin-top:2px; }
  .drug-card-body{ padding:0 16px 18px; border-top:1px solid var(--border); }
  .drug-section{ margin-top:14px; }
  .drug-section h4{ font-size:0.76rem; text-transform:uppercase; letter-spacing:0.03em; color:var(--text-muted); margin:0 0 6px; }
  .drug-section p{ margin:0; font-size:0.9rem; }
  .drug-section ul{ margin:0; padding-left:18px; font-size:0.88rem; line-height:1.6; }
  .footnote{ font-size:0.76rem; color:var(--text-muted); margin-top:26px; line-height:1.6; }
  .footnote a{ color:var(--accent); }
  .divider{ height:1px; background:var(--border); border:none; margin:18px 0; }
  .field-row{ display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .qcount{ font-family:var(--font-mono); font-size:0.78rem; color:var(--text-muted); }

  /* ---- Quick reference ---- */
  .sched-card{ border:1px solid var(--border); border-radius:12px; background:var(--bg-elevated); padding:16px; margin-bottom:12px; }
  .sched-card .sched-head{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
  .sched-card .sched-title{ font-weight:700; font-size:0.98rem; }

  .audio-progress-fill{ height:100%; background:var(--accent); }

  .tutor-cat-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }

  .tutor-formula-box{ font-family:var(--font-mono); font-size:0.92rem; background:var(--surface-2); border-radius:8px; padding:10px 14px; margin:6px 0; overflow-x:auto; white-space:pre-wrap; }

  var GLOSSARY_MAP = {};
  GLOSSARY.forEach(function(g){ GLOSSARY_MAP[g.a.toUpperCase()] = g.m; });
  RX_ABBREV.forEach(function(cat){
    cat.items.forEach(function(it){
      it.a.split("/").forEach(function(variant){
        var key = variant.trim().toUpperCase();
        if (key && !GLOSSARY_MAP[key]) GLOSSARY_MAP[key] = it.m;
      });
    });
  });
  var GLOSSARY_REGEX = new RegExp("\\b(" + Object.keys(GLOSSARY_MAP).slice().sort(function(a,b){ return b.length-a.length; })
    .map(function(k){ return k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }).join("|") + ")\\b", "gi");
  function highlightAbbrev(escapedText){
    return escapedText.replace(GLOSSARY_REGEX, function(match){
      if (match===match.toLowerCase()) return match; // skip all-lowercase matches (e.g. "cap") to avoid colliding with real words
      var full = GLOSSARY_MAP[match.toUpperCase()];
      if (!full) return match;
      return '<span class="abbr-term" tabindex="0" data-full="'+esc(full)+'">'+match+'</span>';
    });
  }

  var MCQ_SEED = [
    {t:"cardio", q:"A 64-year-old man with newly diagnosed HFrEF (EF 30%) is being started on a beta-blocker in addition to an ACE inhibitor. Which agent is appropriate?",
     o:["Metoprolol tartrate (immediate-release)","Atenolol","Carvedilol","Propranolol"], a:2,
     r:"Only carvedilol, metoprolol succinate (extended-release), and bisoprolol have proven mortality benefit in HFrEF. Metoprolol tartrate (immediate-release) is not the studied formulation, and atenolol/propranolol lack HF outcome data.",
     m:"BAMS — Beta-blocker, ACEi/ARB/ARNI, MRA, SGLT2i are the four pillars of HFrEF therapy.", why:["Metoprolol tartrate is the immediate-release salt — the mortality benefit in HFrEF trials was shown specifically with metoprolol succinate (extended-release), not this formulation.", "Atenolol has never been studied in HFrEF outcome trials and lacks the mortality-benefit evidence base of the guideline-directed agents.", "Correct — carvedilol is one of the three beta-blockers (with metoprolol succinate and bisoprolol) proven to reduce mortality in HFrEF and is part of core guideline-directed therapy.", "Propranolol is a non-selective beta-blocker with no HFrEF outcome data and is not used for this indication."]},
    {t:"cardio", q:"Per current Hypertension Canada guidance, which thiazide-type diuretic is preferred over hydrochlorothiazide for treating essential hypertension?",
     o:["Hydrochlorothiazide","Chlorthalidone","Furosemide","Amiloride"], a:1,
     r:"Chlorthalidone has a longer half-life and stronger evidence for cardiovascular outcome reduction, and is preferred by Hypertension Canada over hydrochlorothiazide. Furosemide is a loop diuretic (not first-line for uncomplicated HTN); amiloride is potassium-sparing and used as add-on therapy.", m:null, why:["Hydrochlorothiazide is effective but has a shorter half-life and weaker outcome-trial evidence than chlorthalidone, which is why Hypertension Canada favours the latter.", "Correct — chlorthalidone's longer half-life and stronger cardiovascular outcome evidence make it the preferred thiazide-type agent.", "Furosemide is a loop diuretic, useful for volume overload but not preferred first-line for uncomplicated essential hypertension.", "Amiloride is a potassium-sparing diuretic used as add-on therapy for resistant hypertension or to offset hypokalemia, not as first-line monotherapy."]},
    {t:"cardio", q:"A patient with atrial fibrillation and a history of prior MI is being considered for rhythm control. Which antiarrhythmic should be AVOIDED due to structural heart disease?",
     o:["Amiodarone","Digoxin","Flecainide","Sotalol with close ECG monitoring"], a:2,
     r:"Flecainide (and other Class IC agents like propafenone) are contraindicated in structural or ischemic heart disease due to increased mortality risk (CAST trial). Amiodarone is the preferred rhythm-control agent when structural heart disease/HF is present.", m:null, why:["Amiodarone is actually the preferred rhythm-control agent in patients with structural heart disease because it lacks the pro-arrhythmic mortality signal seen with Class IC agents.", "Digoxin is used mainly for rate control, not rhythm control, and isn't the drug being asked about avoiding here.", "Correct — flecainide (a Class IC agent) is contraindicated in structural or ischemic heart disease; the CAST trial showed increased mortality from its pro-arrhythmic effects in this population.", "Sotalol can be used with structural heart disease provided QT is monitored closely — it carries a proarrhythmia risk but is not absolutely contraindicated the way flecainide is."]},
    {t:"cardio", q:"A patient presents to the ED with a suspected acute STEMI. What is the appropriate initial aspirin dose?",
     o:["81 mg chewed","162–325 mg chewed (non-enteric-coated)","325 mg swallowed whole with water","650 mg per rectum"], a:1,
     r:"Non-enteric-coated aspirin 162–325 mg should be chewed immediately in suspected ACS for rapid buccal absorption. Long-term secondary prevention afterward uses 81 mg daily.", m:null, why:["81 mg is the long-term secondary-prevention maintenance dose, not the immediate loading dose needed in suspected ACS.", "Correct — a non-enteric-coated 162–325 mg dose chewed immediately achieves rapid buccal absorption and antiplatelet effect, critical in the first minutes of suspected STEMI.", "Enteric-coated or swallowed-whole tablets delay absorption through gastric transit, which is too slow when rapid antiplatelet effect is needed.", "A rectal route and 650 mg dose are not standard for acute ACS management; oral chewed non-enteric aspirin is the recommended route and dose."]},
    {t:"cardio", q:"A patient stable on simvastatin 40 mg daily is prescribed a 7-day course of clarithromycin. What is the most appropriate action?",
     o:["Continue simvastatin as usual","Hold simvastatin during the course or switch to a statin less dependent on CYP3A4 (e.g., rosuvastatin, pravastatin)","Increase the simvastatin dose","No action needed — this is not clinically significant"], a:1,
     r:"Clarithromycin is a strong CYP3A4 inhibitor; combined with simvastatin (a CYP3A4-dependent statin) it markedly increases rhabdomyolysis risk.",
     m:"“Love Simba” — Lovastatin + Simvastatin have the most CYP3A4-dependent interactions among statins.", why:["Continuing unchanged ignores a clinically significant CYP3A4 interaction that substantially raises rhabdomyolysis risk during the antibiotic course.", "Correct — clarithromycin strongly inhibits CYP3A4, and simvastatin is highly CYP3A4-dependent, so holding the statin or switching to one less dependent on this pathway (rosuvastatin, pravastatin) avoids the interaction.", "Increasing the dose would compound the interaction and further raise myopathy/rhabdomyolysis risk — the opposite of the safe action.", "This is a well-documented, clinically significant interaction, not one that can be safely ignored."]},

    {t:"endo", q:"A patient on metformin (eGFR 55) is scheduled for a CT scan with IV iodinated contrast tomorrow. What should the pharmacist advise?",
     o:["Continue metformin without interruption","Hold metformin around the time of contrast and for ~48 hours after, resuming once renal function is confirmed stable","Permanently discontinue metformin","Double the metformin dose to compensate"], a:1,
     r:"Iodinated contrast can transiently impair renal function, raising lactic acidosis risk with metformin. Standard practice is to hold metformin around contrast administration, especially when eGFR <60, and resume after confirming stable renal function.", m:null, why:["Continuing metformin uninterrupted ignores the real (if transient) risk that contrast-induced renal impairment poses for lactic acidosis.", "Correct — standard practice is to hold metformin around the time of contrast administration and for about 48 hours after, resuming only once renal function is confirmed stable.", "Permanent discontinuation is unnecessary — the risk is time-limited to the period of possible transient renal impairment after contrast.", "Doubling the dose during a period of potential renal impairment would increase lactic acidosis risk, not reduce it."]},
    {t:"endo", q:"A patient on empagliflozin develops vomiting and poor oral intake from a GI illness. Applying sick-day medication rules, what should the pharmacist recommend?",
     o:["Continue empagliflozin as usual","Temporarily hold empagliflozin until eating/drinking normally, given the risk of euglycemic DKA and dehydration","Double the dose to control blood sugar","Switch immediately to insulin"], a:1,
     r:"SGLT2 inhibitors should be held during acute illness with poor intake, due to risk of euglycemic diabetic ketoacidosis — glucose can look deceptively normal.",
     m:"SADMANS sick-day list: Sulfonylureas, ACEi/ARB, Diuretics, Metformin, SGLT2i — hold during illness.", why:["Continuing an SGLT2 inhibitor during acute illness with poor intake raises the risk of euglycemic DKA, where glucose looks falsely reassuring while ketoacidosis develops.", "Correct — SGLT2 inhibitors are on the standard sick-day list and should be held until the patient is eating/drinking normally and the illness resolves.", "Doubling the dose during illness would worsen dehydration and euglycemic DKA risk rather than help.", "Switching to insulin is an overreaction for a temporary illness; the correct sick-day action is simply to hold the SGLT2 inhibitor, not change therapy entirely."]},
    {t:"endo", q:"According to Diabetes Canada, what is the general A1C target for most adults with type 2 diabetes?",
     o:["≤6.0%","≤7.0%","≤8.0%","≤9.0%"], a:1,

    {t:"endo", q:"A type 1 diabetic patient is found unconscious at home with a glucose of 2.1 mmol/L. Only an untrained family member is present. What is the most appropriate immediate treatment?",

    {t:"endo", q:"A patient is newly started on levothyroxine. Which counselling point about administration timing is most important?",

     o:["New-onset asthma; recommend a SABA inhaler","ACE-inhibitor-induced cough; recommend she see her physician about switching to an ARB","A common cold; recommend a cough suppressant","A normal side effect that requires no action"], a:1,
     r:"A dry, persistent cough starting after ACE inhibitor initiation is a classic bradykinin-mediated side effect. It isn't dangerous but is bothersome enough to warrant switching to an ARB, which doesn't cause cough.", m:null, why:["A cough beginning after starting an ACE inhibitor with no prior asthma history and no other respiratory symptoms is not a new asthma diagnosis.", "Correct — a dry, persistent cough after starting an ACE inhibitor is a classic bradykinin-mediated class effect; switching to an ARB (which doesn't affect bradykinin) typically resolves it.", "A cold would be self-limited and unrelated to medication timing — the temporal link to ramipril initiation points to a drug cause.", "While not dangerous, ACE-inhibitor cough is often bothersome enough that patients benefit from switching agents rather than being told no action is needed."]},

    {t:"cns", q:"A patient on sertraline is prescribed tramadol for acute pain by a walk-in clinic. What is the primary safety concern?",
     o:["QT prolongation","Serotonin syndrome","Extrapyramidal symptoms","Hepatotoxicity"], a:1,
     r:"Tramadol has serotonergic activity in addition to its opioid effect; combined with an SSRI, it raises the risk of serotonin syndrome.",
     m:"FLUSH — Fever, Loss of coordination, Upset stomach, Shivering/sweating, Hyperreflexia.", why:["QT prolongation isn't the primary concern with this particular combination — the shared risk here is serotonergic, not cardiac conduction.", "Correct — tramadol has serotonergic activity in addition to its opioid effect, and combined with an SSRI like sertraline this raises the risk of serotonin syndrome.", "Extrapyramidal symptoms are associated with dopamine-blocking agents (e.g., antipsychotics), not this combination.", "Neither drug is a classic hepatotoxin in this interaction — the relevant risk is serotonergic, not hepatic."]},
    {t:"cns", q:"An 82-year-old with a history of falls asks about restarting lorazepam for sleep. What is the most appropriate counselling point?",
     o:["Benzodiazepines are first-line and safe for insomnia in the elderly","Benzodiazepines are potentially inappropriate per the Beers Criteria — increased fall risk, cognitive impairment, and sedation; discuss safer alternatives with her prescriber","The dose should simply be doubled for effectiveness","No risks are associated with benzodiazepine use in this population"], a:1,
     r:"Benzodiazepines are on the Beers Criteria list of potentially inappropriate medications in older adults due to increased risk of falls, fractures, motor vehicle accidents, and cognitive impairment.", m:null, why:["Benzodiazepines are specifically flagged as potentially inappropriate in older adults, not a safe first-line choice, especially with a fall history.", "Correct — benzodiazepines are on the Beers Criteria due to increased fall risk, cognitive impairment, and sedation in older adults, so safer alternatives should be discussed with the prescriber.", "Doubling the dose would worsen sedation and fall risk in a population already flagged as high-risk for this medication class.", "This population carries well-documented elevated risk from benzodiazepines — the opposite of 'no risk.'"]},
    {t:"cns", q:"A patient on phenytoin has a small dose increase and experiences a disproportionately large rise in serum concentration with new signs of toxicity (nystagmus, ataxia). What explains this?",
     o:["First-order (linear) kinetics","Zero-order (saturable/nonlinear) kinetics near the therapeutic range","Enhanced renal clearance","Increased protein binding"], a:1,
     r:"Phenytoin metabolism becomes saturable near the therapeutic range, so small dose increases can cause disproportionately large concentration increases — a classic reason for careful, small-step titration with TDM.", m:null, why:["First-order kinetics would produce a proportional rise in concentration with a small dose increase, not the disproportionate jump described.", "Correct — phenytoin metabolism becomes saturable (zero-order) near the therapeutic range, so small dose increases can cause disproportionately large concentration rises and toxicity.", "Phenytoin is hepatically metabolized, not renally cleared, so renal clearance isn't the mechanism here.", "Protein binding changes can affect free drug levels but don't explain this specific saturable-metabolism phenomenon."]},
    {t:"cns", q:"Which antipsychotic carries a well-recognized, dose-dependent risk of QT prolongation, especially IV or at high doses?",
     o:["Aripiprazole","Haloperidol","Quetiapine at low bedtime dose","Lurasidone"], a:1,
     r:"Haloperidol, particularly given IV, carries a well-recognized QT prolongation and torsades de pointes risk; ECG monitoring is recommended with IV use or high doses.",
     m:"HAM SACS — Haloperidol, Amiodarone, Methadone, Sotalol, Azithromycin, Citalopram, fluoroquinolonS.", why:["Aripiprazole is relatively QT-neutral among antipsychotics compared to haloperidol.", "Correct — haloperidol, especially given IV or at high doses, carries a well-recognized dose-dependent QT-prolongation and torsades risk, warranting ECG monitoring.", "Low-dose quetiapine at bedtime carries comparatively lower QT risk than IV/high-dose haloperidol.", "Lurasidone has a comparatively favourable QT profile among atypical antipsychotics."]},
    {t:"cns", q:"A patient newly started on olanzapine should be monitored for which of the following?",
     o:["Only extrapyramidal symptoms","Weight gain, dyslipidemia, and hyperglycemia (metabolic syndrome)","Bradycardia only","Peripheral neuropathy"], a:1,
     r:"Olanzapine and clozapine carry the highest metabolic risk among atypical antipsychotics — weight, waist circumference, fasting glucose, and lipids should be monitored at baseline and regularly during treatment.", m:null, why:["EPS is more characteristic of high-potency first-generation antipsychotics; olanzapine's defining risk profile is metabolic, not extrapyramidal.", "Correct — olanzapine and clozapine carry the highest metabolic risk among atypical antipsychotics, so weight, waist circumference, glucose, and lipids need baseline and ongoing monitoring.", "Bradycardia is not the hallmark concern with olanzapine — metabolic effects are.", "Peripheral neuropathy is not a recognized olanzapine adverse effect; metabolic syndrome is the key monitoring concern."]},

    {t:"infd", q:"A 45-year-old woman (CrCl 25 mL/min) presents with an uncomplicated UTI. Why would nitrofurantoin be an inappropriate choice?",
     o:["It is not effective against common uropathogens","At CrCl <30 mL/min it fails to reach adequate urinary concentrations and carries increased risk of systemic toxicity","It requires IV administration","It is contraindicated in all women"], a:1,
     r:"Nitrofurantoin depends on adequate renal excretion to reach therapeutic urinary concentrations; in significant renal impairment it is both less effective and more likely to cause systemic (e.g., pulmonary) toxicity.",
     m:"“Nitro needs flow — less than 30, let it go!”", why:["Nitrofurantoin is actually effective against common uropathogens when renal function is adequate — the problem here is specifically renal impairment, not spectrum of activity.", "Correct — nitrofurantoin depends on renal excretion to reach therapeutic urinary concentrations; below CrCl 30 mL/min it's both less effective and more likely to cause systemic toxicity.", "Nitrofurantoin is an oral agent — it isn't given IV, and that isn't the reason it's inappropriate here.", "Nitrofurantoin is not contraindicated in women generally — the issue is specifically her reduced renal function."]},
    {t:"infd", q:"A patient is dispensed ciprofloxacin for a complicated UTI. Which counselling point is essential?",
     o:["Take with a full glass of milk to improve absorption","Separate from dairy, calcium, iron, and antacids by ≥2 hours, and report any tendon pain immediately","No food or drug precautions are needed","Combine with an antacid to reduce GI upset"], a:1,
     r:"Divalent/trivalent cations chelate fluoroquinolones and significantly reduce absorption. Tendon rupture, QT prolongation, and CNS effects are also key safety points.", m:null, why:["Milk contains calcium, which chelates fluoroquinolones and reduces absorption — the opposite of what should be recommended.", "Correct — divalent/trivalent cations (dairy, calcium, iron, antacids) significantly reduce fluoroquinolone absorption, and tendon rupture is a serious safety signal patients need to know to report.", "Important food and safety precautions do apply to fluoroquinolones, so 'no precautions' is incorrect.", "An antacid would chelate the drug and reduce its absorption, worsening rather than helping GI tolerability."]},
    {t:"infd", q:"Per current Canadian practice, what is first-line treatment for a first episode of non-severe C. difficile infection?",
     o:["Metronidazole","Oral vancomycin or fidaxomicin","IV vancomycin","Ciprofloxacin"], a:1,
     r:"Oral vancomycin or fidaxomicin are now preferred over metronidazole for C. difficile infection given superior clinical cure rates; metronidazole is reserved for settings where these aren't available in mild disease.", m:null, why:["Metronidazole is now reserved for settings where oral vancomycin or fidaxomicin aren't available in mild disease, given inferior cure rates.", "Correct — oral vancomycin or fidaxomicin are preferred first-line for C. difficile infection due to superior clinical cure rates compared with metronidazole.", "Oral vancomycin is used for C. difficile because it acts locally in the gut; IV vancomycin doesn't reach the colon in effective concentrations for this indication.", "Ciprofloxacin has no role in treating C. difficile and is actually a common risk factor for causing it."]},
    {t:"infd", q:"A patient stable on warfarin (INR 2.4) is started on a 10-day course of ciprofloxacin. What should the pharmacist anticipate?",
     o:["No interaction; no monitoring needed","Ciprofloxacin may increase INR via CYP inhibition; recommend closer INR monitoring during and after the course","Ciprofloxacin will decrease INR significantly","Warfarin should be stopped completely during antibiotic therapy"], a:1,
     r:"Ciprofloxacin inhibits warfarin metabolism and can significantly raise INR/bleeding risk; closer INR monitoring is warranted during and after any interacting antibiotic course.",
     m:"CHAMPS — Ciprofloxacin, amiodarone/azoles, Metronidazole, Phenytoin (acute), Sulfonamides raise INR.", why:["Ciprofloxacin is a recognized CYP inhibitor that can raise INR — 'no interaction' understates a real, monitorable risk.", "Correct — ciprofloxacin can inhibit warfarin metabolism and raise INR/bleeding risk, so closer INR monitoring during and after the antibiotic course is the appropriate response.", "The interaction raises INR, not lowers it — this option has the direction backwards.", "Warfarin doesn't need to be stopped outright; the standard approach is increased monitoring, adjusting the dose if INR rises significantly."]},
    {t:"infd", q:"A pharmacist receives a prescription for codeine-containing cough syrup for a 6-year-old. What is the appropriate action?",
     o:["Dispense as written; codeine is safe in all children","Decline to dispense — codeine is contraindicated under age 12 in Canada due to CYP2D6 ultra-rapid metabolizer risk of fatal respiratory depression","Dispense but double the recommended dose","Substitute with a higher dose of codeine"], a:1,
     r:"Health Canada restricts codeine in children under 12 because CYP2D6 ultra-rapid metabolizers convert codeine to morphine unpredictably fast, risking fatal respiratory depression.", m:null, why:["Codeine is not safe in all children — it's specifically restricted in this age group due to unpredictable CYP2D6-driven morphine conversion.", "Correct — Health Canada restricts codeine use in children under 12 because ultra-rapid CYP2D6 metabolizers can convert codeine to morphine unpredictably fast, risking fatal respiratory depression.", "Doubling the dose of a drug already restricted for safety reasons in this age group would compound the risk, not resolve it.", "Substituting a higher codeine dose still exposes the child to the same unpredictable-metabolism danger — a non-codeine alternative is what's actually needed."]},

    {t:"renal", q:"A 68-year-old woman, weight 60 kg, SCr 1.0 mg/dL. Using the Cockcroft-Gault equation, what is her estimated creatinine clearance?",
     o:["60 mL/min (forgetting the female correction factor)","51 mL/min","72 mL/min","43 mL/min"], a:1,
     r:"CrCl = [(140−age) × weight] / [72 × SCr] × 0.85 (female) = [(140−68)×60] / [72×1.0] × 0.85 = 60 × 0.85 = 51 mL/min. Forgetting the 0.85 female correction factor is a common exam error.", m:null, why:["This is the value you'd get by omitting the required 0.85 female correction factor — a common calculation error, not the correct answer.", "Correct — CrCl = [(140−68)×60] / (72×1.0) × 0.85 = 60 × 0.85 = 51 mL/min.", "This value doesn't correspond to the correct Cockcroft-Gault calculation using her actual age, weight, and SCr.", "This underestimates her clearance — it doesn't match the correct formula applied to the given values."]},
    {t:"renal", q:"A patient with CKD stage 3 (eGFR 42) asks to purchase ibuprofen OTC for chronic knee pain. What should the pharmacist recommend?",
     o:["Ibuprofen is safe at any renal function","Avoid regular NSAID use; recommend acetaminophen first-line and refer to prescriber if pain persists","Recommend high-dose ibuprofen for best effect","Add a second NSAID for synergy"], a:1,
     r:"NSAIDs reduce renal prostaglandin-mediated blood flow and can worsen renal function, especially with regular use in CKD. Acetaminophen is generally preferred within recommended dosing limits.", m:null, why:["NSAIDs are not safe at any renal function — they reduce renal prostaglandin-mediated blood flow and can worsen function, particularly in existing CKD.", "Correct — regular NSAID use should be avoided in CKD; acetaminophen is the preferred first-line option, with referral if pain isn't controlled.", "A higher NSAID dose would increase, not mitigate, the renal risk in a patient with reduced kidney function.", "Combining two NSAIDs adds toxicity risk without added analgesic benefit and is never appropriate."]},
    {t:"renal", q:"A patient on lisinopril and spironolactone for heart failure is started on ibuprofen by another prescriber for back pain. What is the primary concern?",
     o:["Increased risk of hyperkalemia and acute kidney injury from the combination","Increased risk of hypokalemia","No interaction of concern","Increased risk of hypertension only"], a:0,
     r:"ACE inhibitor + potassium-sparing diuretic + NSAID forms the “triple whammy” — each reduces renal perfusion/potassium excretion, substantially increasing AKI and hyperkalemia risk.", m:null, why:["Correct — ACE inhibitor + potassium-sparing diuretic + NSAID is the classic 'triple whammy': each component reduces renal perfusion or potassium excretion, and together they substantially raise AKI and hyperkalemia risk.", "This combination raises potassium (via the ACE inhibitor and spironolactone), not lowers it — the direction here is wrong.", "This is one of the best-known drug-interaction patterns in renal pharmacology, not a benign combination.", "The primary concern is renal function and potassium, not blood pressure elevation."]},
    {t:"renal", q:"A patient with AFib and CrCl of 25 mL/min is being considered for anticoagulation. Why is dabigatran an inappropriate choice?",
     o:["Dabigatran is primarily hepatically cleared and unaffected by renal function","Dabigatran is largely renally eliminated (~80%) and is contraindicated when CrCl <30 mL/min","Dabigatran requires no dose adjustment regardless of renal function","Dabigatran is only available as an IV formulation"], a:1,
     r:"Dabigatran is about 80% renally eliminated — more than other DOACs — and is contraindicated at CrCl <30 mL/min. Apixaban or dose-adjusted warfarin are typically preferred in significant renal impairment.", m:null, why:["This has it backwards — dabigatran is predominantly renally eliminated, not hepatically cleared, which is exactly why renal function matters so much for this drug.", "Correct — dabigatran is about 80% renally eliminated, more than other DOACs, and is contraindicated when CrCl is below 30 mL/min; apixaban or dose-adjusted warfarin are typically preferred instead.", "Renal function significantly affects dabigatran clearance and dosing — 'no adjustment regardless' is incorrect.", "Dabigatran is available as an oral capsule, not only IV, and route isn't the issue here — renal elimination is."]},
    {t:"renal", q:"A patient is started on ramipril for hypertension. Which labs should be monitored within 1–2 weeks of initiation?",
     o:["Liver enzymes only","Serum creatinine and potassium","Complete blood count only","Thyroid function"], a:1,
     r:"ACE inhibitors can cause hyperkalemia and an initial (usually modest, acceptable) creatinine rise from reduced efferent arteriolar tone; SCr and K+ should be checked at baseline and 1–2 weeks after initiation or dose increases.", m:null, why:["Liver enzymes aren't the relevant monitoring parameter for ACE inhibitors — renal function and potassium are.", "Correct — ACE inhibitors can cause hyperkalemia and a typically modest initial creatinine rise from reduced efferent arteriolar tone, so SCr and potassium should be checked at baseline and 1–2 weeks after starting or increasing the dose.", "A CBC isn't the standard monitoring parameter for ACE inhibitor initiation.", "Thyroid function isn't affected by ACE inhibitors and isn't part of their monitoring protocol."]},

    {t:"gi", q:"A patient is newly prescribed omeprazole for GERD. What is the correct counselling point regarding timing?",
     o:["Take with food at bedtime","Take 30–60 minutes before the first meal of the day","Timing does not matter","Take only when symptomatic (as needed)"], a:1,
     r:"PPIs are prodrugs activated in the acidic environment of actively secreting parietal cells; taking 30–60 minutes before a meal maximizes the proportion of proton pumps available for irreversible inhibition.", m:null, why:["Bedtime dosing with food doesn't align PPI activation with actively secreting parietal cells during a meal, reducing effectiveness.", "Correct — PPIs are prodrugs activated only in actively secreting parietal cells; dosing 30–60 minutes before a meal maximizes the proportion of proton pumps available for irreversible inhibition when the drug is active.", "Timing significantly affects how many proton pumps are inhibited — it very much matters for PPI effectiveness.", "PPIs work best with consistent daily dosing tied to a meal, not on an as-needed/symptomatic basis, for reliable acid suppression."]},
    {t:"gi", q:"A patient has been on long-term daily PPI therapy for 5 years. Which is a recognized risk of long-term use?",
     o:["Increased risk of C. difficile infection, fracture risk, and vitamin B12 deficiency","No long-term risks have been identified","Improved bone density","Decreased risk of pneumonia"], a:0,
     r:"Long-term PPI use is associated with increased risk of enteric infections (including C. difficile), hypomagnesemia, B12 deficiency, and possible fracture risk — periodic reassessment of ongoing need is recommended.", m:null, why:["Correct — long-term PPI therapy is associated with increased risk of enteric infections including C. difficile, hypomagnesemia, B12 deficiency, and possible fracture risk, supporting periodic reassessment of ongoing need.", "Long-term PPI use does carry recognized risks — this understates a well-documented safety profile.", "PPIs are associated with a possible increase in fracture risk, not improved bone density.", "PPI use has actually been linked to increased (not decreased) risk of certain pneumonias, related to reduced gastric acid's protective antimicrobial effect."]},
    {t:"gi", q:"A patient on warfarin regularly takes acetaminophen 1000 mg four times daily for chronic pain. What is the pharmacist's concern?",
     o:["No interaction exists between acetaminophen and warfarin","Regular high-dose acetaminophen (>2 g/day) can potentiate warfarin's effect and raise INR; more frequent monitoring is warranted","Acetaminophen will decrease INR significantly","This combination must never be used together"], a:1,
     r:"While occasional acetaminophen use is the safest analgesic option for warfarin patients, regular higher-dose use can raise INR — closer monitoring (not avoidance) is appropriate.", m:null, why:["There is a recognized interaction with regular higher-dose use — 'no interaction' is incorrect.", "Correct — while occasional acetaminophen use is the safest analgesic choice for warfarin patients, regular use above roughly 2 g/day can potentiate warfarin's effect and raise INR, so closer monitoring (not avoidance) is warranted.", "The interaction raises INR, not lowers it.", "This combination isn't prohibited — acetaminophen remains the preferred analgesic in warfarin patients; it just needs monitoring at regular higher doses."]},
    {t:"gi", q:"A new prescription arrives for methotrexate 2.5 mg tablets, “take one tablet daily,” for rheumatoid arthritis. What should the pharmacist do?",
     o:["Dispense as written","Contact the prescriber to clarify — low-dose methotrexate for RA is dosed once WEEKLY; daily dosing is a well-known fatal error","Assume it's correct since it's a low dose","Change the frequency without contacting the prescriber"], a:1,
     r:"Low-dose methotrexate for RA/psoriasis is dosed once weekly, not daily. Daily-dosing errors are a classic, potentially fatal prescribing error, and catching this is a critical pharmacist safety check.", m:null, why:["Dispensing daily-dosed low-dose methotrexate as written would carry forward a well-known, potentially fatal prescribing error.", "Correct — low-dose methotrexate for RA is dosed once weekly, not daily; this is one of the most important pharmacist safety checks, and the prescriber must be contacted to clarify/correct the order.", "Assuming it's correct because the dose is 'low' ignores that daily dosing of even a small tablet strength accumulates to a dangerous cumulative weekly dose.", "A pharmacist should never unilaterally change a prescription's frequency without first clarifying with the prescriber, even when an error is suspected."]},
    {t:"gi", q:"A patient is counselled on new alendronate therapy for osteoporosis. What are the essential administration instructions?",
     o:["Take with a large meal to reduce stomach upset","Take first thing in the morning on an empty stomach with a full glass of plain water, and remain upright for ≥30 minutes without eating","Take at bedtime lying down","Crush and mix with food for easier swallowing"], a:1,
     r:"Oral bisphosphonates have poor bioavailability and can cause esophageal irritation; they must be taken on an empty stomach with plain water, remaining upright for at least 30 minutes before eating or lying down.", m:null, why:["Food significantly impairs the already-poor bioavailability of oral bisphosphonates, so taking it with a meal defeats the purpose.", "Correct — bisphosphonates must be taken first thing in the morning on an empty stomach with a full glass of plain water, remaining upright for at least 30 minutes, to maximize absorption and prevent esophageal irritation.", "Lying down after dosing risks reflux of the drug into the esophagus, causing irritation or ulceration.", "Crushing and mixing with food both reduces absorption and increases the risk of esophageal irritation — the opposite of correct administration."]},

    {t:"pain", q:"A patient on rivaroxaban for AFib asks to add naproxen for knee arthritis pain. What should the pharmacist advise?",
     o:["This combination is safe with no additional risk","Combining an NSAID with a DOAC significantly raises GI bleeding risk; recommend acetaminophen first-line and discuss with the prescriber if an NSAID is truly needed","Increase the rivaroxaban dose to compensate","NSAIDs enhance the anticoagulant effect safely"], a:1,
     r:"NSAIDs impair platelet function and irritate the GI mucosa; combined with any anticoagulant this substantially raises bleeding risk. Acetaminophen is preferred first-line for pain in anticoagulated patients.", m:null, why:["Combining an NSAID with any anticoagulant is not risk-free — it significantly raises GI bleeding risk.", "Correct — NSAIDs impair platelet function and irritate the GI mucosa, and combined with a DOAC this substantially raises bleeding risk; acetaminophen is preferred first-line, with an NSAID discussed with the prescriber only if truly needed.", "Increasing the anticoagulant dose has nothing to do with the analgesic interaction and would only add bleeding risk.", "NSAIDs don't safely 'enhance' anticoagulation — the interaction is a bleeding-risk concern, not a beneficial synergy."]},
    {t:"pain", q:"A patient calls stating they lost their hydromorphone prescription and asks for a refill from the file. What is the appropriate response?",
     o:["Refill immediately since the original prescription is on file","Explain that narcotic prescriptions cannot be refilled without a new prescription from the prescriber, per CDSA regulations, regardless of the reason","Provide a partial emergency supply without prescriber contact","Transfer the balance from another pharmacy"], a:1,
     r:"Under the CDSA, narcotic prescriptions cannot be refilled — each dispense requires a new written prescription, and narcotic prescriptions cannot be transferred between pharmacies either.", m:null, why:["Narcotic prescriptions cannot legally be refilled from the file regardless of the reason for the request.", "Correct — under the CDSA, narcotic prescriptions have no refills; each dispense requires a new written prescription from the prescriber, and narcotics also cannot be transferred between pharmacies.", "Providing any emergency supply of a narcotic without prescriber contact bypasses the legal requirement for a new prescription.", "Narcotic prescriptions specifically cannot be transferred between pharmacies, unlike most other prescriptions."]},
    {t:"pain", q:"A patient is started on regular opioid therapy for chronic cancer pain. Which adverse effect should be proactively addressed?",
     o:["Opioid-induced constipation — start a stimulant ± osmotic laxative prophylactically, since tolerance to this effect does not develop","Nausea only, since tolerance develops quickly to all opioid effects","No prophylactic measures are needed","Respiratory depression prophylaxis with naloxone for all patients"], a:0,
     r:"Unlike sedation and nausea (to which tolerance typically develops), opioid-induced constipation does not improve with continued use, so a scheduled bowel regimen should start proactively, not reactively.", m:null, why:["Correct — unlike sedation and nausea, tolerance does not develop to opioid-induced constipation, so a scheduled stimulant ± osmotic laxative should be started proactively at the time opioid therapy begins.", "This describes nausea, to which tolerance often does develop — the point of the question is the adverse effect that does NOT improve with time, which is constipation.", "No prophylaxis would leave the patient to develop constipation before treatment starts, which is the reactive (not recommended) approach.", "Naloxone is for reversing opioid overdose/respiratory depression, not for managing constipation, and prophylactic naloxone for all patients isn't standard practice."]},
    {t:"pain", q:"Which population warrants particular caution or avoidance when counselling on a new NSAID prescription?",
     o:["A healthy 25-year-old with no comorbidities","Patients with heart failure, CKD, active GI ulcer disease, or in the third trimester of pregnancy","Patients with seasonal allergies","Patients with well-controlled hypothyroidism"], a:1,
     r:"NSAIDs are used cautiously or avoided in heart failure (fluid retention), CKD (nephrotoxicity), active peptic ulcer/GI bleed history, and the third trimester of pregnancy (premature ductus arteriosus closure).", m:null, why:["A healthy young adult with no comorbidities is actually one of the lower-risk populations for NSAID use, not one requiring particular caution.", "Correct — NSAIDs are used cautiously or avoided in heart failure (fluid retention), CKD (nephrotoxicity), active GI ulcer disease (bleeding risk), and the third trimester of pregnancy (premature ductus arteriosus closure).", "Seasonal allergies have no particular bearing on NSAID safety.", "Well-controlled hypothyroidism doesn't create any specific NSAID risk."]},
    {t:"pain", q:"A patient with a seizure disorder asks about using tramadol for pain. What should the pharmacist highlight?",
     o:["Tramadol has no effect on seizure threshold","Tramadol lowers the seizure threshold and should be used cautiously or avoided, especially at higher doses","Tramadol is the safest opioid option in epilepsy","Tramadol cures seizure disorders"], a:1,
     r:"Tramadol has a well-documented, dose-dependent risk of lowering seizure threshold, in addition to serotonergic activity; caution is warranted in patients with a seizure disorder.", m:null, why:["Tramadol does affect seizure threshold — this option denies a well-documented risk.", "Correct — tramadol has a well-documented, dose-dependent risk of lowering seizure threshold, so it should be used cautiously or avoided in patients with a seizure disorder.", "Tramadol is actually one of the opioids most associated with seizure risk, making it a poor (not the safest) choice in epilepsy.", "Tramadol is an analgesic with a seizure-risk liability — it has no role in treating or curing seizure disorders."]},

    {t:"womens", q:"A 38-year-old who smokes 1 pack/day requests a combined oral contraceptive. What is the pharmacist's primary safety concern?",
     o:["No additional risk in smokers","Combined hormonal contraceptives in smokers ≥35 significantly raise VTE, MI, and stroke risk; a progestin-only or non-hormonal method should be discussed","Smoking has no interaction with hormonal contraceptives","The estrogen dose should simply be increased"], a:1,
     r:"Smoking plus combined hormonal contraceptives in women ≥35 is a recognized contraindication due to markedly increased cardiovascular and thromboembolic risk; progestin-only options are safer alternatives.", m:null, why:["Smoking combined with combined hormonal contraceptives, especially at age 35+, is a recognized risk factor, not a risk-neutral combination.", "Correct — combined hormonal contraceptives in smokers 35 and older significantly raise VTE, MI, and stroke risk, so a progestin-only or non-hormonal method should be discussed instead.", "There is a well-established interaction between smoking and estrogen-containing contraceptives via increased cardiovascular/thromboembolic risk.", "Increasing the estrogen dose would raise cardiovascular risk further, not mitigate it — the correct action is to avoid estrogen-containing methods in this patient."]},
    {t:"womens", q:"A pregnant patient in her third trimester asks about ibuprofen for back pain. What should the pharmacist recommend?",
     o:["Ibuprofen is safe throughout pregnancy","Avoid NSAIDs in the third trimester due to risk of premature closure of the fetal ductus arteriosus; recommend acetaminophen instead","Recommend a higher dose for effective relief","NSAIDs are only unsafe in the first trimester"], a:1,
     r:"NSAIDs are avoided in the third trimester due to risk of premature ductus arteriosus closure and effects on fetal renal function/amniotic fluid volume. Acetaminophen remains the analgesic of choice in pregnancy.", m:null, why:["NSAIDs are not considered safe throughout pregnancy — third-trimester use carries specific fetal risks.", "Correct — NSAIDs are avoided in the third trimester due to the risk of premature closure of the fetal ductus arteriosus and effects on fetal renal function/amniotic fluid volume; acetaminophen remains the analgesic of choice.", "A higher dose would increase, not reduce, the risk to the fetus in the third trimester.", "The specific ductus arteriosus risk is a third-trimester concern — this option has the timing backwards."]},
    {t:"womens", q:"A patient taking lisinopril for hypertension learns she is 6 weeks pregnant. What is the most appropriate action?",
     o:["Continue lisinopril throughout pregnancy","Discontinue the ACE inhibitor promptly and switch to a pregnancy-safe agent (e.g., labetalol, methyldopa, nifedipine) with her prescriber","Double the dose for better BP control","No changes needed until the third trimester"], a:1,
     r:"ACE inhibitors/ARBs are contraindicated throughout pregnancy due to risk of fetal renal damage, oligohydramnios, and other fetopathy — they should be switched as soon as pregnancy is identified.", m:null, why:["ACE inhibitors are contraindicated throughout pregnancy, not just in later trimesters, so continuing is not appropriate.", "Correct — ACE inhibitors/ARBs risk fetal renal damage, oligohydramnios, and other fetopathy; they should be discontinued and switched to a pregnancy-safe agent (labetalol, methyldopa, nifedipine) as soon as pregnancy is identified.", "Doubling the dose of a contraindicated medication would worsen fetal risk, not address the safety concern.", "Waiting until the third trimester leaves the fetus exposed to ACE-inhibitor risk during earlier development — the switch should happen as soon as pregnancy is confirmed."]},
    {t:"womens", q:"A patient requests emergency contraception (levonorgestrel) at the pharmacy. Under NAPRA scheduling, what applies?",
     o:["It requires a prescription in all provinces","It is Schedule II — available without a prescription, through consultation with the pharmacist behind the counter","It is unscheduled and available on any store shelf","It is a controlled substance under the CDSA"], a:1,
     r:"Levonorgestrel emergency contraception is NAPRA Schedule II — no prescription required, but it must be accessed through pharmacist consultation rather than self-selected off the shelf.", m:null, why:["Levonorgestrel emergency contraception does not require a prescription under NAPRA scheduling.", "Correct — it is NAPRA Schedule II, meaning no prescription is required, but it must be accessed through consultation with the pharmacist rather than selected directly off an open shelf.", "Schedule II products are not simply placed on open shelves — they require pharmacist involvement, distinguishing them from unscheduled products.", "Emergency contraception is not a CDSA-controlled substance; CDSA governs narcotics and controlled drugs, a different regulatory category."]},
    {t:"womens", q:"A breastfeeding mother is prescribed codeine for postpartum pain. What is the safety concern?",
     o:["Codeine is completely safe in all breastfeeding mothers","If the mother is a CYP2D6 ultra-rapid metabolizer, codeine is converted to morphine more rapidly, risking dangerously high breast-milk morphine and infant respiratory depression","Codeine has no effect on breast milk","Only the infant's own metabolism matters, not the mother's"], a:1,
     r:"This mirrors the pediatric CYP2D6 concern, but here it's the mother's rapid conversion of codeine to morphine that can raise breast-milk levels dangerously — codeine is generally avoided in breastfeeding.", m:null, why:["Codeine is not considered completely safe in breastfeeding — there's a recognized, sometimes serious risk pathway.", "Correct — if the mother is a CYP2D6 ultra-rapid metabolizer, she converts codeine to morphine unusually fast, which can raise breast-milk morphine to levels that cause dangerous infant respiratory depression.", "Codeine and its morphine metabolite do pass into breast milk — this option incorrectly denies that transfer.", "This mirrors the pediatric concern but here it's specifically the mother's metabolism that determines breast-milk morphine exposure, not the infant's own metabolism."]},

    {t:"regs", q:"A physician calls wanting to verbally order oxycodone 5 mg for a discharging patient. What must the pharmacist do?",

    {t:"regs", q:"A community member asks to obtain a naloxone kit without a prescription for a family member at risk of opioid overdose. What applies under NAPRA scheduling in most provinces?",

    {t:"regs", q:"A pharmacist identifies a pattern suggesting a patient has a disease reportable to public health. Can this be disclosed without the patient's consent?",
     o:["No, patient consent is always required with no exceptions","Yes — reportable diseases to public health authorities are a recognized exception to the consent requirement under privacy legislation","Only the physician can make this report, never the pharmacist","This information can only be shared with insurance companies"], a:1,
     r:"Privacy legislation permits disclosure without explicit consent in defined circumstances, including reportable diseases to public health, medical emergencies, court orders, and suspected child abuse.", m:null, why:["Privacy legislation includes defined exceptions to the consent requirement, so 'always required, no exceptions' is incorrect.", "Correct — reportable diseases to public health authorities are a recognized exception allowing disclosure without explicit patient consent, alongside exceptions like medical emergencies and court orders.", "Pharmacists, like other health professionals, can participate in mandatory public health reporting — it isn't physician-exclusive.", "Public health reporting exists to protect community health, not to serve insurance purposes — this option describes an unrelated (and inappropriate) disclosure recipient."]},

    {t:"pk", q:"A drug has a half-life of 8 hours. Approximately how long will it take to reach steady-state plasma concentration with regular dosing?",
     o:["8 hours","16 hours","32–40 hours (4–5 half-lives)","80 hours"], a:2,
     r:"Steady state is reached after approximately 4–5 half-lives of regular dosing, regardless of dose or interval. For an 8-hour half-life, that's roughly 32–40 hours.", m:null, why:["One half-life alone gets a drug only partway there — steady state requires several half-lives of consistent dosing, not just one.", "Two half-lives (16h) is still well short of the 4–5 half-lives generally needed to consider a drug at steady state.", "Correct — steady state is reached after approximately 4–5 half-lives of regular dosing regardless of dose or interval; for an 8-hour half-life that's roughly 32–40 hours.", "80 hours (10 half-lives) is well beyond what's needed — steady state for practical purposes is reached at 4–5 half-lives, not 10."]},
    {t:"pk", q:"Nitroglycerin for acute angina is given sublingually rather than orally. Why?",
     o:["Sublingual administration avoids extensive first-pass hepatic metabolism, allowing much faster and more reliable systemic levels","Sublingual tablets taste better","Oral nitroglycerin works just as fast","Sublingual administration increases first-pass metabolism"], a:0,
     r:"Nitroglycerin undergoes extensive first-pass hepatic metabolism when swallowed, giving negligible oral bioavailability. Sublingual (or IV/transdermal) routes bypass this for rapid, reliable absorption.",
     m:"“My Nice Puppy Loves” (high first-pass drugs) = Morphine, Nitroglycerin, Propranolol, Lidocaine.", why:["Correct — nitroglycerin undergoes extensive first-pass hepatic metabolism when swallowed, giving it negligible oral bioavailability; the sublingual route bypasses this for rapid, reliable systemic levels needed in acute angina.", "Taste isn't the clinical rationale for route selection — pharmacokinetics is.", "Oral nitroglycerin does not work as fast — its bioavailability by that route is essentially negligible due to first-pass metabolism.", "This has the mechanism backwards — the sublingual route avoids (not increases) first-pass metabolism, which is exactly why it's used."]},
    {t:"pk", q:"A CYP2C19 poor metabolizer is prescribed clopidogrel after coronary stent placement. What is the clinical concern?",
     o:["Increased bleeding risk from excess active drug","Reduced conversion of clopidogrel (a prodrug) to its active metabolite, causing diminished antiplatelet effect and higher stent thrombosis risk","No clinical significance","Clopidogrel does not require metabolic activation"], a:1,
     r:"Clopidogrel requires CYP2C19-mediated activation. Poor metabolizers generate less active drug, resulting in inadequate platelet inhibition and higher cardiovascular event risk — an alternative agent may be considered.", m:null, why:["A poor metabolizer generates less active drug, not excess — this describes the opposite direction of the actual risk.", "Correct — clopidogrel is a prodrug requiring CYP2C19 activation; poor metabolizers produce less active metabolite, resulting in inadequate platelet inhibition and higher stent thrombosis risk.", "This is a clinically significant, actionable pharmacogenomic finding — it's not something to disregard.", "Clopidogrel does require metabolic activation to become pharmacologically active — this option denies a defining feature of the drug."]},
    {t:"pk", q:"A drug has a very large volume of distribution (Vd = 500 L in a 70 kg patient). What does this suggest?",
     o:["The drug stays almost entirely within the blood/plasma compartment","The drug distributes extensively into tissues outside the vascular compartment (Vd this large has no direct physiologic 'space')","The drug is highly water-soluble and stays intravascular","The drug cannot be dialyzed regardless of other properties"], a:1,
     r:"A Vd far exceeding total body water (~42 L) indicates extensive tissue distribution/binding (e.g., digoxin, chloroquine) rather than staying in the blood — relevant to loading dose calculations and dialyzability.", m:null, why:["A Vd this large (far exceeding actual body volume) indicates the opposite — the drug is leaving the blood compartment for tissues, not staying in it.", "Correct — a Vd of 500 L in a 70 kg patient, far exceeding total body water (~42 L), reflects extensive tissue distribution/binding rather than a real physiologic 'space,' relevant to loading-dose calculations.", "High water solubility staying intravascular would produce a small, not large, Vd close to plasma or extracellular volume.", "Dialyzability depends on multiple factors (protein binding, molecular size) in addition to Vd — a large Vd alone doesn't universally rule out dialysis, making this an overly absolute statement."]},
    {t:"pk", q:"A drug has a target plasma concentration of 20 mg/L and a Vd of 50 L. Assuming 100% bioavailability (IV), what loading dose is required?",

     r:"Loading dose = Target Cp × Vd = 20 mg/L × 50 L = 1000 mg.", m:null, why:["This is a quarter of the correct value — check the formula: Target Cp × Vd, not divided.", "This is half of the correct value for the given target concentration and volume of distribution.", "Correct — Loading dose = Target Cp × Vd = 20 mg/L × 50 L = 1000 mg.", "This is double the correct value — recalculate using Target Cp × Vd directly."]},

    {t:"inter", q:"A patient stable on warfarin is started on amiodarone for atrial fibrillation. What adjustment is typically needed?",
     o:["No adjustment needed","Warfarin dose typically reduced by ~30–50% due to CYP2C9 inhibition and protein-binding displacement, with closer INR monitoring","Warfarin dose should be doubled","Amiodarone should never be combined with warfarin"], a:1,
     r:"Amiodarone potently inhibits CYP2C9 metabolism of warfarin and displaces it from plasma proteins. This interaction is significant and long-lasting (amiodarone has a very long half-life), requiring an empiric dose reduction with vigilant INR monitoring.", m:null, why:["This interaction is significant enough that unchanged dosing risks over-anticoagulation and bleeding — 'no adjustment' is unsafe.", "Correct — amiodarone inhibits CYP2C9 metabolism of warfarin and displaces it from plasma proteins; because amiodarone has a very long half-life, this effect is prolonged, so an empiric dose reduction of about 30–50% with vigilant INR monitoring is standard.", "Doubling the warfarin dose in the presence of a potentiating interaction would risk dangerous over-anticoagulation.", "These drugs are commonly combined in practice — the interaction is managed with dose adjustment and monitoring, not by avoiding the combination entirely."]},
    {t:"inter", q:"A patient stopped phenelzine (an MAOI) 10 days ago and now wants to start sertraline. What is the concern?",
     o:["No washout period is needed between MAOIs and SSRIs","A washout period (typically ≥14 days after stopping an MAOI) is required before starting an SSRI to avoid life-threatening serotonin syndrome","The two drugs are actually synergistic and recommended together","Only a 24-hour washout is needed"], a:1,
     r:"Combining MAOIs with SSRIs carries a high risk of severe/fatal serotonin syndrome. A washout of at least 14 days after stopping an MAOI (5 weeks after fluoxetine) is required before starting the other class.", m:null, why:["Skipping the washout risks life-threatening serotonin syndrome — a washout period is specifically required for this drug class transition.", "Correct — a washout of at least 14 days after stopping an MAOI (5 weeks after fluoxetine specifically) is required before starting an SSRI, to avoid potentially fatal serotonin syndrome.", "MAOIs and SSRIs are dangerous in combination, not synergistic or recommended together.", "24 hours is far too short — the required washout for this combination is measured in weeks, not a single day."]},
    {t:"inter", q:"A patient on citalopram 40 mg daily is prescribed azithromycin. What is the pharmacist's concern?",
     o:["No interaction of concern","Both drugs independently prolong the QT interval; the combination raises torsades de pointes risk, especially with other risk factors","Azithromycin will decrease citalopram levels","This combination improves antidepressant efficacy"], a:1,
     r:"Citalopram and azithromycin are both associated with dose-dependent QT prolongation; combining QT-prolonging drugs has an additive risk of torsades de pointes.", m:null, why:["Both drugs independently carry QT-prolongation risk, so 'no concern' understates a real, additive safety issue.", "Correct — citalopram and azithromycin are each independently associated with dose-dependent QT prolongation, and combining QT-prolonging drugs has an additive risk of torsades de pointes, especially with other risk factors present.", "This describes a pharmacokinetic interaction that isn't the primary concern here — the issue is an additive pharmacodynamic (QT) effect, not a level change.", "This combination is a safety concern, not a therapeutic benefit — there's no efficacy synergy being described."]},
    {t:"inter", q:"A patient taking simvastatin asks if it's safe to drink grapefruit juice regularly. What should the pharmacist advise?",

     r:"Grapefruit juice inhibits CYP3A4 specifically in the gut wall, reducing first-pass metabolism and increasing oral bioavailability of substrates like simvastatin/lovastatin.", m:null, why:["Grapefruit juice does have a well-documented pharmacokinetic effect on CYP3A4-dependent statins — this option denies a real interaction.", "Correct — grapefruit juice inhibits intestinal CYP3A4, increasing oral bioavailability of CYP3A4-dependent statins like simvastatin and raising myopathy/rhabdomyolysis risk; patients should avoid or limit it.", "This is a first-pass (oral bioavailability) interaction specific to orally absorbed drugs — it's not relevant to IV medications at all.", "Grapefruit juice increases, not decreases, levels of CYP3A4-dependent oral drugs by inhibiting their gut-wall metabolism."]},
    {t:"inter", q:"A patient taking a combined oral contraceptive starts self-treating mild depression with St. John's Wort. What is the concern?",
     o:["No interaction exists","St. John's Wort is a potent CYP3A4 inducer that can significantly reduce contraceptive hormone levels, raising the risk of contraceptive failure","St. John's Wort will make the contraceptive more effective","St. John's Wort only interacts with prescription antidepressants"], a:1,
     r:"St. John's Wort strongly induces CYP3A4 (and P-glycoprotein), lowering plasma levels of many drugs including combined hormonal contraceptives, cyclosporine, and warfarin.", m:null, why:["St. John's Wort has a well-documented, clinically important interaction with combined hormonal contraceptives — this option denies a real risk.", "Correct — St. John's Wort strongly induces CYP3A4 (and P-glycoprotein), lowering plasma levels of combined hormonal contraceptives and raising the risk of contraceptive failure and breakthrough bleeding.", "Induction lowers contraceptive hormone levels, which reduces (not improves) effectiveness.", "St. John's Wort's induction effect is broad, affecting many CYP3A4 substrates including hormonal contraceptives and other drugs, not just prescription antidepressants."]}
