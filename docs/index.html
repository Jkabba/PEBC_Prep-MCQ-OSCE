<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEBC Prep — MCQ &amp; OSCE Simulator</title>
<style>
  :root{
    --bg:#F1F4EE;
    --bg-elevated:#FFFFFF;
    --surface-2:#E6EAE0;
    --border:#D3DAC9;
    --text:#16231C;
    --text-muted:#4E5C51;
    --accent:#1F5449;
    --accent-soft:#DCE8E1;
    --accent-contrast:#FFFFFF;
    --gold:#96691C;
    --gold-soft:#F1E3C6;
    --success:#2E7D5B;
    --success-soft:#DCEEE3;
    --danger:#A9463C;
    --danger-soft:#F5DEDA;
    --info:#35678A;
    --info-soft:#DCE8F0;
    --shadow:rgba(23,35,28,0.10);
    --font-display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:ui-monospace,"SF Mono","Cascadia Code","Roboto Mono",Consolas,monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0F1713;
      --bg-elevated:#17211C;
      --surface-2:#1E2921;
      --border:#2B382F;
      --text:#E7EDE6;
      --text-muted:#9FB2A4;
      --accent:#59B092;
      --accent-soft:#1D372C;
      --accent-contrast:#08150F;
      --gold:#E0AC55;
      --gold-soft:#3A2E17;
      --success:#57B98D;
      --success-soft:#1B3226;
      --danger:#E28B7D;
      --danger-soft:#3A211C;
      --info:#82B7DA;
      --info-soft:#1C2C38;
      --shadow:rgba(0,0,0,0.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1713; --bg-elevated:#17211C; --surface-2:#1E2921; --border:#2B382F;
    --text:#E7EDE6; --text-muted:#9FB2A4; --accent:#59B092; --accent-soft:#1D372C;
    --accent-contrast:#08150F; --gold:#E0AC55; --gold-soft:#3A2E17; --success:#57B98D;
    --success-soft:#1B3226; --danger:#E28B7D; --danger-soft:#3A211C; --info:#82B7DA;
    --info-soft:#1C2C38; --shadow:rgba(0,0,0,0.5); color-scheme: dark;
  }
  :root[data-theme="light"]{
    --bg:#F1F4EE; --bg-elevated:#FFFFFF; --surface-2:#E6EAE0; --border:#D3DAC9;
    --text:#16231C; --text-muted:#4E5C51; --accent:#1F5449; --accent-soft:#DCE8E1;
    --accent-contrast:#FFFFFF; --gold:#96691C; --gold-soft:#F1E3C6; --success:#2E7D5B;
    --success-soft:#DCEEE3; --danger:#A9463C; --danger-soft:#F5DEDA; --info:#35678A;
    --info-soft:#DCE8F0; --shadow:rgba(23,35,28,0.10); color-scheme: light;
  }

  *{box-sizing:border-box;}
  body{margin:0;}
  #pebc-app{
    font-family:var(--font-body);
    color:var(--text);
    background:var(--bg);
    min-height:100%;
    line-height:1.5;
  }
  #pebc-app *{ min-width:0; }
  #pebc-app :focus-visible{
    outline:2.5px solid var(--gold);
    outline-offset:2px;
    border-radius:4px;
  }
  #pebc-app h1,#pebc-app h2,#pebc-app h3{
    font-family:var(--font-display);
    text-wrap:balance;
    margin:0;
    font-weight:600;
  }
  #pebc-app button{ font-family:inherit; }
  #pebc-app .tnum{ font-variant-numeric:tabular-nums; font-family:var(--font-mono); }

  .shell{
    display:grid;
    grid-template-columns:248px 1fr;
    min-height:640px;
  }
  @media (max-width:820px){
    .shell{ grid-template-columns:1fr; }
  }

  /* ---- Rail ---- */
  .rail{
    background:var(--bg-elevated);
    border-right:1px solid var(--border);
    padding:22px 18px 18px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }
  @media (max-width:820px){
    .rail{
      border-right:none;
      border-bottom:1px solid var(--border);
      flex-direction:row;
      align-items:center;
      flex-wrap:wrap;
      padding:14px 16px;
      gap:12px;
    }
  }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand .mark{
    font-family:var(--font-display);
    font-size:1.28rem;
    letter-spacing:0.01em;
    color:var(--accent);
  }
  .brand .tag{
    font-size:0.72rem;
    color:var(--text-muted);
    letter-spacing:0.03em;
  }
  @media (max-width:820px){ .brand{ margin-right:auto; } }

  .navlist{ display:flex; flex-direction:column; gap:4px; }
  @media (max-width:820px){ .navlist{ flex-direction:row; flex-wrap:wrap; } }
  .navbtn{
    display:flex; align-items:center; gap:10px;
    padding:9px 11px;
    border-radius:8px;
    border:1px solid transparent;
    background:transparent;
    color:var(--text-muted);
    font-size:0.92rem;
    font-weight:600;
    cursor:pointer;
    text-align:left;
  }
  .navbtn:hover{ background:var(--surface-2); color:var(--text); }
  .navbtn[aria-current="true"]{
    background:var(--accent-soft);
    color:var(--accent);
    border-color:var(--accent-soft);
  }
  .navbtn .dot{
    width:7px; height:7px; border-radius:50%;
    background:currentColor; opacity:0.55; flex:none;
  }

  .rail-stats{
    margin-top:auto;
    border-top:1px solid var(--border);
    padding-top:16px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  @media (max-width:820px){ .rail-stats{ display:none; } }
  .rail-stat-row{ display:flex; justify-content:space-between; align-items:baseline; }
  .rail-stat-label{ font-size:0.74rem; color:var(--text-muted); }
  .rail-stat-value{ font-size:0.95rem; font-weight:700; }

  /* ---- Main ---- */
  .main{ padding:26px 30px 60px; max-width:820px; }
  @media (max-width:820px){ .main{ padding:20px 18px 50px; } }

  .pagehead{ margin-bottom:22px; }
  .pagehead h1{ font-size:1.5rem; }
  .pagehead p{ margin:5px 0 0; color:var(--text-muted); font-size:0.92rem; max-width:60ch; }

  .cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:12px;
    margin-bottom:26px;
  }
  .stat-card{
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 16px;
    box-shadow:0 1px 2px var(--shadow);
  }
  .stat-card .label{ font-size:0.72rem; color:var(--text-muted); letter-spacing:0.03em; text-transform:uppercase; }
  .stat-card .value{ font-family:var(--font-mono); font-size:1.5rem; font-weight:600; margin-top:4px; font-variant-numeric:tabular-nums; }
  .stat-card .sub{ font-size:0.76rem; color:var(--text-muted); margin-top:2px; }

  .panel{
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:14px;
    padding:22px;
    box-shadow:0 1px 3px var(--shadow);
    margin-bottom:20px;
  }
  .panel h2{ font-size:1.08rem; margin-bottom:4px; }
  .panel + .panel{ margin-top:0; }

  .topicbars{ display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .topicbar-row{ display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; font-size:0.86rem; }
  .topicbar-track{
    grid-column:1 / -1;
    height:7px; border-radius:4px; background:var(--surface-2); overflow:hidden;
  }
  .topicbar-fill{ height:100%; background:var(--accent); border-radius:4px; }
  .topicbar-name{ font-weight:600; }
  .topicbar-pct{ font-family:var(--font-mono); color:var(--text-muted); font-variant-numeric:tabular-nums; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border-radius:9px; border:1px solid var(--border);
    background:var(--bg-elevated); color:var(--text);
    font-size:0.9rem; font-weight:600; padding:10px 16px;
    cursor:pointer;
  }
  .btn:hover{ background:var(--surface-2); }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-contrast); }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-ghost{ background:transparent; border-color:transparent; color:var(--text-muted); }
  .btn-ghost:hover{ background:var(--surface-2); color:var(--text); }
  .btn-sm{ padding:6px 11px; font-size:0.8rem; border-radius:7px; }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
  .btn[disabled]{ opacity:0.5; cursor:not-allowed; }

  select.select{
    font-family:inherit; font-size:0.86rem; padding:8px 10px;
    border-radius:8px; border:1px solid var(--border);
    background:var(--bg-elevated); color:var(--text);
  }

  .badge{
    display:inline-flex; align-items:center; gap:6px;
    font-size:0.72rem; font-weight:700; letter-spacing:0.03em; text-transform:uppercase;
    padding:3px 9px; border-radius:100px;
    background:var(--surface-2); color:var(--text-muted);
  }
  .badge-accent{ background:var(--accent-soft); color:var(--accent); }
  .badge-gold{ background:var(--gold-soft); color:var(--gold); }

  /* ---- MCQ ---- */
  .q-meta{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px; flex-wrap:wrap; }
  .q-stem{ font-size:1.05rem; line-height:1.55; margin-bottom:18px; }
  .options{ display:flex; flex-direction:column; gap:10px; }
  .option{
    display:flex; align-items:flex-start; gap:12px;
    text-align:left;
    border:1px solid var(--border); border-radius:10px;
    background:var(--bg-elevated);
    padding:12px 14px;
    cursor:pointer;
    font-size:0.94rem;
  }
  .option:hover{ background:var(--surface-2); }
  .option .letter{
    flex:none; width:24px; height:24px; border-radius:50%;
    background:var(--surface-2); color:var(--text-muted);
    display:flex; align-items:center; justify-content:center;
    font-size:0.76rem; font-weight:700; font-family:var(--font-mono);
  }
  .option[data-state="correct"]{ background:var(--success-soft); border-color:var(--success); }
  .option[data-state="correct"] .letter{ background:var(--success); color:#fff; }
  .option[data-state="incorrect"]{ background:var(--danger-soft); border-color:var(--danger); }
  .option[data-state="incorrect"] .letter{ background:var(--danger); color:#fff; }
  .option[disabled]{ cursor:default; }

  .feedback{
    margin-top:18px; padding:16px; border-radius:10px;
    border:1px solid var(--border); background:var(--surface-2);
  }
  .feedback .verdict{ font-weight:700; margin-bottom:6px; }
  .feedback.correct .verdict{ color:var(--success); }
  .feedback.incorrect .verdict{ color:var(--danger); }
  .feedback .rationale{ font-size:0.92rem; color:var(--text); }
  .feedback .mnemonic{
    margin-top:10px; padding-top:10px; border-top:1px dashed var(--border);
    font-size:0.86rem; color:var(--gold); font-style:italic;
  }

  /* ---- OSCE ---- */
  .station-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; }
  .station-card{
    text-align:left; border:1px solid var(--border); border-radius:12px;
    background:var(--bg-elevated); padding:15px; cursor:pointer;
  }
  .station-card:hover{ background:var(--surface-2); }
  .station-card .st-title{ font-weight:700; font-size:0.95rem; margin-bottom:6px; }
  .station-card .st-blurb{ font-size:0.8rem; color:var(--text-muted); }
  .station-card .st-foot{ margin-top:10px; display:flex; justify-content:space-between; align-items:center; }

  .timer-box{
    display:flex; align-items:center; gap:10px;
    background:var(--surface-2); border-radius:10px; padding:8px 14px;
    width:fit-content;
  }
  .timer-box .clock{ font-family:var(--font-mono); font-size:1.3rem; font-weight:700; font-variant-numeric:tabular-nums; }

  .scenario-box{
    background:var(--surface-2); border-radius:10px; padding:16px; margin:16px 0;
    font-size:0.95rem; line-height:1.6;
  }
  .task-box{
    background:var(--accent-soft); color:var(--accent); border-radius:10px;
    padding:12px 16px; font-size:0.9rem; font-weight:600; margin-bottom:16px;
  }
  textarea.notes{
    width:100%; min-height:110px; border-radius:10px; border:1px solid var(--border);
    background:var(--bg-elevated); color:var(--text); font-family:inherit; font-size:0.9rem;
    padding:12px; resize:vertical;
  }

  .checklist{ display:flex; flex-direction:column; gap:9px; margin:14px 0; }
  .check-item{ display:flex; align-items:flex-start; gap:10px; font-size:0.9rem; }
  .check-item input{ margin-top:3px; flex:none; width:16px; height:16px; accent-color:var(--accent); }

  .score-ring-wrap{ display:flex; align-items:center; gap:16px; margin:12px 0; }
  .score-ring{ width:64px; height:64px; border-radius:50%; flex:none;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-weight:700; font-size:0.95rem;
    background:conic-gradient(var(--accent) calc(var(--pct,0)*1%), var(--surface-2) 0);
  }
  .score-ring::before{
    content:""; position:relative;
  }
  .score-ring .inner{
    width:48px; height:48px; border-radius:50%; background:var(--bg-elevated);
    display:flex; align-items:center; justify-content:center;
  }

  /* ---- History ---- */
  .hist-table{ width:100%; border-collapse:collapse; font-size:0.85rem; }
  .hist-table th{
    text-align:left; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.03em;
    color:var(--text-muted); border-bottom:1px solid var(--border); padding:8px 6px;
  }
  .hist-table td{ padding:9px 6px; border-bottom:1px solid var(--border); }
  .hist-scroll{ overflow-x:auto; }
  .pill{
    display:inline-block; padding:2px 9px; border-radius:100px; font-size:0.72rem; font-weight:700;
  }
  .pill-correct{ background:var(--success-soft); color:var(--success); }
  .pill-incorrect{ background:var(--danger-soft); color:var(--danger); }
  .pill-osce{ background:var(--info-soft); color:var(--info); }

  .empty{
    text-align:center; color:var(--text-muted); padding:40px 20px; font-size:0.9rem;
  }

  .toast{
    position:fixed; bottom:20px; right:20px; background:var(--text); color:var(--bg);
    padding:10px 16px; border-radius:9px; font-size:0.85rem; box-shadow:0 4px 14px var(--shadow);
    opacity:0; transform:translateY(6px); transition:opacity .2s, transform .2s; pointer-events:none;
    z-index:50;
  }
  .toast.show{ opacity:1; transform:translateY(0); }

  @media (prefers-reduced-motion: reduce){
    #pebc-app *{ transition:none !important; }
  }

  /* ---- Drug reference ---- */
  input.textinput{
    font-family:inherit; font-size:0.86rem; padding:9px 12px;
    border-radius:8px; border:1px solid var(--border);
    background:var(--bg-elevated); color:var(--text); flex:1; min-width:180px;
  }
  .drug-list{ display:flex; flex-direction:column; gap:10px; }
  .drug-card{
    border:1px solid var(--border); border-radius:12px; background:var(--bg-elevated);
    overflow:hidden;
  }
  .drug-card-head{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:14px 16px; cursor:pointer; text-align:left; width:100%; background:none; border:none; font-family:inherit;
  }
  .drug-card-head:hover{ background:var(--surface-2); }
  .drug-name{ font-weight:700; font-size:0.98rem; color:var(--text); }
  .drug-pronunciation{
    display:inline-flex; align-items:center; gap:4px;
    font-size:0.8rem; color:var(--text-muted); font-style:italic; margin-left:6px;
    background:none; border:none; padding:0; font-family:inherit; cursor:pointer;
  }
  .drug-pronunciation:hover, .drug-pronunciation:focus-visible{ color:var(--accent); }
  .drug-pronunciation svg{ width:12px; height:12px; flex:none; }
  .drug-pronunciation[data-playing="true"]{ color:var(--accent); }
  .drug-brand{ font-size:0.8rem; color:var(--text-muted); margin-top:2px; }
  .drug-card-body{ padding:0 16px 18px; border-top:1px solid var(--border); }
  .drug-section{ margin-top:14px; }
  .drug-section h4{ font-size:0.76rem; text-transform:uppercase; letter-spacing:0.03em; color:var(--text-muted); margin:0 0 6px; }
  .drug-section p{ margin:0; font-size:0.9rem; }
  .drug-section ul{ margin:0; padding-left:18px; font-size:0.88rem; line-height:1.6; }
  .footnote{ font-size:0.76rem; color:var(--text-muted); margin-top:26px; line-height:1.6; }
  .footnote a{ color:var(--accent); }
  .divider{ height:1px; background:var(--border); border:none; margin:18px 0; }
  .field-row{ display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .qcount{ font-family:var(--font-mono); font-size:0.78rem; color:var(--text-muted); }

  /* ---- Quick reference ---- */
  .sched-card{ border:1px solid var(--border); border-radius:12px; background:var(--bg-elevated); padding:16px; margin-bottom:12px; }
  .sched-card .sched-head{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
  .sched-card .sched-title{ font-weight:700; font-size:0.98rem; }
  .sched-card .sched-desc{ font-size:0.88rem; color:var(--text-muted); margin:6px 0 10px; line-height:1.55; }
  .sched-tags{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .sched-tag{ font-size:0.78rem; background:var(--surface-2); color:var(--text); padding:3px 9px; border-radius:100px; }
  .sched-rules{ margin:0; padding-left:18px; font-size:0.85rem; line-height:1.6; color:var(--text); }

  .abbrev-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; }
  .abbrev-item{ border:1px solid var(--border); border-radius:9px; background:var(--bg-elevated); padding:9px 12px; }
  .abbrev-item .a-code{ font-family:var(--font-mono); font-weight:700; font-size:0.86rem; color:var(--accent); }
  .abbrev-item .a-mean{ font-size:0.83rem; color:var(--text-muted); margin-top:2px; }
  .danger-row{ border:1px solid var(--danger); background:var(--danger-soft); border-radius:9px; padding:10px 14px; margin-bottom:8px; }
  .danger-row .d-bad{ font-family:var(--font-mono); font-weight:700; color:var(--danger); font-size:0.88rem; }
  .danger-row .d-why{ font-size:0.83rem; margin:3px 0; }
  .danger-row .d-fix{ font-size:0.83rem; color:var(--success); font-weight:600; }

  .kroll-card{ border:1px solid var(--border); border-radius:12px; background:var(--bg-elevated); padding:15px; margin-bottom:10px; cursor:pointer; }
  .kroll-card:hover{ background:var(--surface-2); }
  .kroll-card .k-head{ display:flex; align-items:center; gap:10px; }
  .kroll-card .k-num{ flex:none; width:26px; height:26px; border-radius:50%; background:var(--accent-soft); color:var(--accent); font-family:var(--font-mono); font-weight:700; font-size:0.78rem; display:flex; align-items:center; justify-content:center; }
  .kroll-card .k-title{ font-weight:700; font-size:0.92rem; }
  .kroll-steps{ list-style:none; margin:12px 0 0; padding:0; counter-reset:kstep; }
  .kroll-steps li{ counter-increment:kstep; position:relative; padding:8px 0 8px 30px; font-size:0.9rem; line-height:1.55; border-top:1px dashed var(--border); }
  .kroll-steps li:first-child{ border-top:none; }
  .kroll-steps li::before{ content:counter(kstep); position:absolute; left:0; top:8px; width:20px; height:20px; border-radius:50%; background:var(--accent); color:var(--accent-contrast); font-family:var(--font-mono); font-size:0.72rem; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .kroll-diagram-wrap{ overflow-x:auto; margin-bottom:8px; }
  .kroll-diagram-wrap svg{ display:block; min-width:640px; }

  .abbr-term{
    border-bottom:1.5px dotted var(--gold); color:inherit; cursor:pointer;
    font-weight:600;
  }
  .abbr-term:hover, .abbr-term:focus-visible{ color:var(--gold); }

  .calc-card{ border:1px solid var(--border); border-radius:12px; background:var(--bg-elevated); padding:16px; margin-bottom:12px; }
  .calc-card h3{ font-size:0.98rem; margin-bottom:8px; }
  .calc-formula{
    font-family:var(--font-mono); font-size:0.86rem; background:var(--surface-2);
    border-radius:8px; padding:10px 12px; margin-bottom:12px; line-height:1.6; white-space:pre-wrap;
  }
  .calc-card h4{ font-size:0.74rem; text-transform:uppercase; letter-spacing:0.03em; color:var(--text-muted); margin:12px 0 6px; }
  .calc-card ul{ margin:0; padding-left:18px; font-size:0.87rem; line-height:1.6; }
</style>

</head>
<body>
<div id="pebc-app">
  <div class="shell">
    <nav class="rail" aria-label="Primary">
      <div class="brand">
        <span class="mark">PEBC Prep</span>
        <span class="tag">MCQ &amp; OSCE simulator</span>
      </div>
      <div class="navlist" id="navlist"></div>
      <div class="rail-stats" id="railStats"></div>
    </nav>

     r:"ICS use in COPD increases pneumonia risk; current guidance restricts ICS add-on to patients with frequent exacerbations AND elevated blood eosinophils, favouring dual bronchodilation (LAMA/LABA) otherwise.", m:null},
    {t:"resp", q:"During OSCE counselling on a new pMDI (puffer), which technique point is essential to include?",
     o:["Inhale quickly and forcefully through the device","Shake, exhale fully, actuate at the start of a slow deep breath in, then hold breath ~10 seconds","No need to hold the breath after inhaling","Spacer devices are never recommended"], a:1,
     r:"Correct pMDI technique: shake, exhale away from the device, actuate at the start of a slow deep inhalation, then hold the breath ~10 seconds. A spacer improves delivery and reduces oropharyngeal deposition (important for ICS — lowers thrush risk).", m:null},
    {t:"resp", q:"A patient wants an OTC recommendation for seasonal allergic rhinitis and needs to avoid drowsiness for work (driving). What should the pharmacist recommend?",
     o:["Diphenhydramine","A second-generation antihistamine such as cetirizine or loratadine","Chlorpheniramine","No OTC treatment is available"], a:1,
     r:"Second-generation antihistamines cause significantly less sedation and psychomotor impairment than first-generation agents like diphenhydramine, making them preferred for patients who need to drive or operate machinery.", m:null},
    {t:"resp", q:"A patient started on ramipril 2 months ago develops a new, persistent dry cough with no history of asthma. What is the most likely cause and appropriate action?",
     o:["New-onset asthma; recommend a SABA inhaler","ACE-inhibitor-induced cough; recommend she see her physician about switching to an ARB","A common cold; recommend a cough suppressant","A normal side effect that requires no action"], a:1,
     r:"A dry, persistent cough starting after ACE inhibitor initiation is a classic bradykinin-mediated side effect. It isn't dangerous but is bothersome enough to warrant switching to an ARB, which doesn't cause cough.", m:null},

    {t:"cns", q:"A patient on sertraline is prescribed tramadol for acute pain by a walk-in clinic. What is the primary safety concern?",
     o:["QT prolongation","Serotonin syndrome","Extrapyramidal symptoms","Hepatotoxicity"], a:1,
     r:"Tramadol has serotonergic activity in addition to its opioid effect; combined with an SSRI, it raises the risk of serotonin syndrome.",
     m:"FLUSH — Fever, Loss of coordination, Upset stomach, Shivering/sweating, Hyperreflexia."},
    {t:"cns", q:"An 82-year-old with a history of falls asks about restarting lorazepam for sleep. What is the most appropriate counselling point?",
     o:["Benzodiazepines are first-line and safe for insomnia in the elderly","Benzodiazepines are potentially inappropriate per the Beers Criteria — increased fall risk, cognitive impairment, and sedation; discuss safer alternatives with her prescriber","The dose should simply be doubled for effectiveness","No risks are associated with benzodiazepine use in this population"], a:1,
     r:"Benzodiazepines are on the Beers Criteria list of potentially inappropriate medications in older adults due to increased risk of falls, fractures, motor vehicle accidents, and cognitive impairment.", m:null},
    {t:"cns", q:"A patient on phenytoin has a small dose increase and experiences a disproportionately large rise in serum concentration with new signs of toxicity (nystagmus, ataxia). What explains this?",
     o:["First-order (linear) kinetics","Zero-order (saturable/nonlinear) kinetics near the therapeutic range","Enhanced renal clearance","Increased protein binding"], a:1,
     r:"Phenytoin metabolism becomes saturable near the therapeutic range, so small dose increases can cause disproportionately large concentration increases — a classic reason for careful, small-step titration with TDM.", m:null},
    {t:"cns", q:"Which antipsychotic carries a well-recognized, dose-dependent risk of QT prolongation, especially IV or at high doses?",
     o:["Aripiprazole","Haloperidol","Quetiapine at low bedtime dose","Lurasidone"], a:1,
     r:"Haloperidol, particularly given IV, carries a well-recognized QT prolongation and torsades de pointes risk; ECG monitoring is recommended with IV use or high doses.",
     m:"HAM SACS — Haloperidol, Amiodarone, Methadone, Sotalol, Azithromycin, Citalopram, fluoroquinolonS."},
    {t:"cns", q:"A patient newly started on olanzapine should be monitored for which of the following?",
     o:["Only extrapyramidal symptoms","Weight gain, dyslipidemia, and hyperglycemia (metabolic syndrome)","Bradycardia only","Peripheral neuropathy"], a:1,
     r:"Olanzapine and clozapine carry the highest metabolic risk among atypical antipsychotics — weight, waist circumference, fasting glucose, and lipids should be monitored at baseline and regularly during treatment.", m:null},

    {t:"infd", q:"A 45-year-old woman (CrCl 25 mL/min) presents with an uncomplicated UTI. Why would nitrofurantoin be an inappropriate choice?",
     o:["It is not effective against common uropathogens","At CrCl <30 mL/min it fails to reach adequate urinary concentrations and carries increased risk of systemic toxicity","It requires IV administration","It is contraindicated in all women"], a:1,
     r:"Nitrofurantoin depends on adequate renal excretion to reach therapeutic urinary concentrations; in significant renal impairment it is both less effective and more likely to cause systemic (e.g., pulmonary) toxicity.",
     m:"“Nitro needs flow — less than 30, let it go!”"},
    {t:"infd", q:"A patient is dispensed ciprofloxacin for a complicated UTI. Which counselling point is essential?",
     o:["Take with a full glass of milk to improve absorption","Separate from dairy, calcium, iron, and antacids by ≥2 hours, and report any tendon pain immediately","No food or drug precautions are needed","Combine with an antacid to reduce GI upset"], a:1,
     r:"Divalent/trivalent cations chelate fluoroquinolones and significantly reduce absorption. Tendon rupture, QT prolongation, and CNS effects are also key safety points.", m:null},
    {t:"infd", q:"Per current Canadian practice, what is first-line treatment for a first episode of non-severe C. difficile infection?",
     o:["Metronidazole","Oral vancomycin or fidaxomicin","IV vancomycin","Ciprofloxacin"], a:1,
     r:"Oral vancomycin or fidaxomicin are now preferred over metronidazole for C. difficile infection given superior clinical cure rates; metronidazole is reserved for settings where these aren't available in mild disease.", m:null},
    {t:"infd", q:"A patient stable on warfarin (INR 2.4) is started on a 10-day course of ciprofloxacin. What should the pharmacist anticipate?",
     o:["No interaction; no monitoring needed","Ciprofloxacin may increase INR via CYP inhibition; recommend closer INR monitoring during and after the course","Ciprofloxacin will decrease INR significantly","Warfarin should be stopped completely during antibiotic therapy"], a:1,
     r:"Ciprofloxacin inhibits warfarin metabolism and can significantly raise INR/bleeding risk; closer INR monitoring is warranted during and after any interacting antibiotic course.",
     m:"CHAMPS — Ciprofloxacin, amiodarone/azoles, Metronidazole, Phenytoin (acute), Sulfonamides raise INR."},
    {t:"infd", q:"A pharmacist receives a prescription for codeine-containing cough syrup for a 6-year-old. What is the appropriate action?",
     o:["Dispense as written; codeine is safe in all children","Decline to dispense — codeine is contraindicated under age 12 in Canada due to CYP2D6 ultra-rapid metabolizer risk of fatal respiratory depression","Dispense but double the recommended dose","Substitute with a higher dose of codeine"], a:1,
     r:"Health Canada restricts codeine in children under 12 because CYP2D6 ultra-rapid metabolizers convert codeine to morphine unpredictably fast, risking fatal respiratory depression.", m:null},

    {t:"renal", q:"A 68-year-old woman, weight 60 kg, SCr 1.0 mg/dL. Using the Cockcroft-Gault equation, what is her estimated creatinine clearance?",
     o:["60 mL/min (forgetting the female correction factor)","51 mL/min","72 mL/min","43 mL/min"], a:1,
     r:"CrCl = [(140−age) × weight] / [72 × SCr] × 0.85 (female) = [(140−68)×60] / [72×1.0] × 0.85 = 60 × 0.85 = 51 mL/min. Forgetting the 0.85 female correction factor is a common exam error.", m:null},
    {t:"renal", q:"A patient with CKD stage 3 (eGFR 42) asks to purchase ibuprofen OTC for chronic knee pain. What should the pharmacist recommend?",
     o:["Ibuprofen is safe at any renal function","Avoid regular NSAID use; recommend acetaminophen first-line and refer to prescriber if pain persists","Recommend high-dose ibuprofen for best effect","Add a second NSAID for synergy"], a:1,
     r:"NSAIDs reduce renal prostaglandin-mediated blood flow and can worsen renal function, especially with regular use in CKD. Acetaminophen is generally preferred within recommended dosing limits.", m:null},
    {t:"renal", q:"A patient on lisinopril and spironolactone for heart failure is started on ibuprofen by another prescriber for back pain. What is the primary concern?",
     o:["Increased risk of hyperkalemia and acute kidney injury from the combination","Increased risk of hypokalemia","No interaction of concern","Increased risk of hypertension only"], a:0,
     r:"ACE inhibitor + potassium-sparing diuretic + NSAID forms the “triple whammy” — each reduces renal perfusion/potassium excretion, substantially increasing AKI and hyperkalemia risk.", m:null},
    {t:"renal", q:"A patient with AFib and CrCl of 25 mL/min is being considered for anticoagulation. Why is dabigatran an inappropriate choice?",
     o:["Dabigatran is primarily hepatically cleared and unaffected by renal function","Dabigatran is largely renally eliminated (~80%) and is contraindicated when CrCl <30 mL/min","Dabigatran requires no dose adjustment regardless of renal function","Dabigatran is only available as an IV formulation"], a:1,
     r:"Dabigatran is about 80% renally eliminated — more than other DOACs — and is contraindicated at CrCl <30 mL/min. Apixaban or dose-adjusted warfarin are typically preferred in significant renal impairment.", m:null},
    {t:"renal", q:"A patient is started on ramipril for hypertension. Which labs should be monitored within 1–2 weeks of initiation?",
     o:["Liver enzymes only","Serum creatinine and potassium","Complete blood count only","Thyroid function"], a:1,
     r:"ACE inhibitors can cause hyperkalemia and an initial (usually modest, acceptable) creatinine rise from reduced efferent arteriolar tone; SCr and K+ should be checked at baseline and 1–2 weeks after initiation or dose increases.", m:null},

    {t:"gi", q:"A patient is newly prescribed omeprazole for GERD. What is the correct counselling point regarding timing?",
     o:["Take with food at bedtime","Take 30–60 minutes before the first meal of the day","Timing does not matter","Take only when symptomatic (as needed)"], a:1,
     r:"PPIs are prodrugs activated in the acidic environment of actively secreting parietal cells; taking 30–60 minutes before a meal maximizes the proportion of proton pumps available for irreversible inhibition.", m:null},
    {t:"gi", q:"A patient has been on long-term daily PPI therapy for 5 years. Which is a recognized risk of long-term use?",
     o:["Increased risk of C. difficile infection, fracture risk, and vitamin B12 deficiency","No long-term risks have been identified","Improved bone density","Decreased risk of pneumonia"], a:0,
     r:"Long-term PPI use is associated with increased risk of enteric infections (including C. difficile), hypomagnesemia, B12 deficiency, and possible fracture risk — periodic reassessment of ongoing need is recommended.", m:null},
    {t:"gi", q:"A patient on warfarin regularly takes acetaminophen 1000 mg four times daily for chronic pain. What is the pharmacist's concern?",
     o:["No interaction exists between acetaminophen and warfarin","Regular high-dose acetaminophen (>2 g/day) can potentiate warfarin's effect and raise INR; more frequent monitoring is warranted","Acetaminophen will decrease INR significantly","This combination must never be used together"], a:1,
     r:"While occasional acetaminophen use is the safest analgesic option for warfarin patients, regular higher-dose use can raise INR — closer monitoring (not avoidance) is appropriate.", m:null},
    {t:"gi", q:"A new prescription arrives for methotrexate 2.5 mg tablets, “take one tablet daily,” for rheumatoid arthritis. What should the pharmacist do?",
     o:["Dispense as written","Contact the prescriber to clarify — low-dose methotrexate for RA is dosed once WEEKLY; daily dosing is a well-known fatal error","Assume it's correct since it's a low dose","Change the frequency without contacting the prescriber"], a:1,
     r:"Low-dose methotrexate for RA/psoriasis is dosed once weekly, not daily. Daily-dosing errors are a classic, potentially fatal prescribing error, and catching this is a critical pharmacist safety check.", m:null},
    {t:"gi", q:"A patient is counselled on new alendronate therapy for osteoporosis. What are the essential administration instructions?",
     o:["Take with a large meal to reduce stomach upset","Take first thing in the morning on an empty stomach with a full glass of plain water, and remain upright for ≥30 minutes without eating","Take at bedtime lying down","Crush and mix with food for easier swallowing"], a:1,
     r:"Oral bisphosphonates have poor bioavailability and can cause esophageal irritation; they must be taken on an empty stomach with plain water, remaining upright for at least 30 minutes before eating or lying down.", m:null},

    {t:"pain", q:"A patient on rivaroxaban for AFib asks to add naproxen for knee arthritis pain. What should the pharmacist advise?",
     o:["This combination is safe with no additional risk","Combining an NSAID with a DOAC significantly raises GI bleeding risk; recommend acetaminophen first-line and discuss with the prescriber if an NSAID is truly needed","Increase the rivaroxaban dose to compensate","NSAIDs enhance the anticoagulant effect safely"], a:1,
     r:"NSAIDs impair platelet function and irritate the GI mucosa; combined with any anticoagulant this substantially raises bleeding risk. Acetaminophen is preferred first-line for pain in anticoagulated patients.", m:null},
    {t:"pain", q:"A patient calls stating they lost their hydromorphone prescription and asks for a refill from the file. What is the appropriate response?",
     o:["Refill immediately since the original prescription is on file","Explain that narcotic prescriptions cannot be refilled without a new prescription from the prescriber, per CDSA regulations, regardless of the reason","Provide a partial emergency supply without prescriber contact","Transfer the balance from another pharmacy"], a:1,
     r:"Under the CDSA, narcotic prescriptions cannot be refilled — each dispense requires a new written prescription, and narcotic prescriptions cannot be transferred between pharmacies either.", m:null},
    {t:"pain", q:"A patient is started on regular opioid therapy for chronic cancer pain. Which adverse effect should be proactively addressed?",
     o:["Opioid-induced constipation — start a stimulant ± osmotic laxative prophylactically, since tolerance to this effect does not develop","Nausea only, since tolerance develops quickly to all opioid effects","No prophylactic measures are needed","Respiratory depression prophylaxis with naloxone for all patients"], a:0,
     r:"Unlike sedation and nausea (to which tolerance typically develops), opioid-induced constipation does not improve with continued use, so a scheduled bowel regimen should start proactively, not reactively.", m:null},
    {t:"pain", q:"Which population warrants particular caution or avoidance when counselling on a new NSAID prescription?",
     o:["A healthy 25-year-old with no comorbidities","Patients with heart failure, CKD, active GI ulcer disease, or in the third trimester of pregnancy","Patients with seasonal allergies","Patients with well-controlled hypothyroidism"], a:1,
     r:"NSAIDs are used cautiously or avoided in heart failure (fluid retention), CKD (nephrotoxicity), active peptic ulcer/GI bleed history, and the third trimester of pregnancy (premature ductus arteriosus closure).", m:null},
    {t:"pain", q:"A patient with a seizure disorder asks about using tramadol for pain. What should the pharmacist highlight?",
     o:["Tramadol has no effect on seizure threshold","Tramadol lowers the seizure threshold and should be used cautiously or avoided, especially at higher doses","Tramadol is the safest opioid option in epilepsy","Tramadol cures seizure disorders"], a:1,
     r:"Tramadol has a well-documented, dose-dependent risk of lowering seizure threshold, in addition to serotonergic activity; caution is warranted in patients with a seizure disorder.", m:null},

    {t:"womens", q:"A 38-year-old who smokes 1 pack/day requests a combined oral contraceptive. What is the pharmacist's primary safety concern?",
     o:["No additional risk in smokers","Combined hormonal contraceptives in smokers ≥35 significantly raise VTE, MI, and stroke risk; a progestin-only or non-hormonal method should be discussed","Smoking has no interaction with hormonal contraceptives","The estrogen dose should simply be increased"], a:1,
     r:"Smoking plus combined hormonal contraceptives in women ≥35 is a recognized contraindication due to markedly increased cardiovascular and thromboembolic risk; progestin-only options are safer alternatives.", m:null},
    {t:"womens", q:"A pregnant patient in her third trimester asks about ibuprofen for back pain. What should the pharmacist recommend?",
     o:["Ibuprofen is safe throughout pregnancy","Avoid NSAIDs in the third trimester due to risk of premature closure of the fetal ductus arteriosus; recommend acetaminophen instead","Recommend a higher dose for effective relief","NSAIDs are only unsafe in the first trimester"], a:1,
     r:"NSAIDs are avoided in the third trimester due to risk of premature ductus arteriosus closure and effects on fetal renal function/amniotic fluid volume. Acetaminophen remains the analgesic of choice in pregnancy.", m:null},
    {t:"womens", q:"A patient taking lisinopril for hypertension learns she is 6 weeks pregnant. What is the most appropriate action?",
     o:["Continue lisinopril throughout pregnancy","Discontinue the ACE inhibitor promptly and switch to a pregnancy-safe agent (e.g., labetalol, methyldopa, nifedipine) with her prescriber","Double the dose for better BP control","No changes needed until the third trimester"], a:1,
     r:"ACE inhibitors/ARBs are contraindicated throughout pregnancy due to risk of fetal renal damage, oligohydramnios, and other fetopathy — they should be switched as soon as pregnancy is identified.", m:null},
    {t:"womens", q:"A patient requests emergency contraception (levonorgestrel) at the pharmacy. Under NAPRA scheduling, what applies?",
     o:["It requires a prescription in all provinces","It is Schedule II — available without a prescription, through consultation with the pharmacist behind the counter","It is unscheduled and available on any store shelf","It is a controlled substance under the CDSA"], a:1,
     r:"Levonorgestrel emergency contraception is NAPRA Schedule II — no prescription required, but it must be accessed through pharmacist consultation rather than self-selected off the shelf.", m:null},
    {t:"womens", q:"A breastfeeding mother is prescribed codeine for postpartum pain. What is the safety concern?",
     o:["Codeine is completely safe in all breastfeeding mothers","If the mother is a CYP2D6 ultra-rapid metabolizer, codeine is converted to morphine more rapidly, risking dangerously high breast-milk morphine and infant respiratory depression","Codeine has no effect on breast milk","Only the infant's own metabolism matters, not the mother's"], a:1,
     r:"This mirrors the pediatric CYP2D6 concern, but here it's the mother's rapid conversion of codeine to morphine that can raise breast-milk levels dangerously — codeine is generally avoided in breastfeeding.", m:null},

    {t:"regs", q:"A physician calls wanting to verbally order oxycodone 5 mg for a discharging patient. What must the pharmacist do?",
     o:["Accept and dispense the verbal order as with any other prescription","Verbal orders are not permitted for narcotics (except defined emergency circumstances); a written/faxed prescription meeting CDSA requirements is required","Refuse to fill any opioid prescription","Ask the patient to obtain it themselves"], a:1,
     r:"Under the CDSA, verbal orders for narcotics are generally not permitted; a proper written or faxed prescription meeting CDSA requirements is required.", m:null},
    {t:"regs", q:"A community member asks to obtain a naloxone kit without a prescription for a family member at risk of opioid overdose. What applies under NAPRA scheduling in most provinces?",
     o:["Naloxone requires a prescription in all cases","Naloxone is Schedule II — it can be provided without a prescription, often through take-home naloxone programs, with pharmacist counselling","Naloxone is unscheduled and requires no professional involvement","Naloxone can only be administered by paramedics"], a:1,
     r:"Naloxone was moved to Schedule II specifically to improve access for overdose prevention — available without a prescription and often free through take-home naloxone programs.", m:null},
    {t:"regs", q:"A pharmacist identifies a pattern suggesting a patient has a disease reportable to public health. Can this be disclosed without the patient's consent?",
     o:["No, patient consent is always required with no exceptions","Yes — reportable diseases to public health authorities are a recognized exception to the consent requirement under privacy legislation","Only the physician can make this report, never the pharmacist","This information can only be shared with insurance companies"], a:1,
     r:"Privacy legislation permits disclosure without explicit consent in defined circumstances, including reportable diseases to public health, medical emergencies, court orders, and suspected child abuse.", m:null},
    {t:"regs", q:"In provinces where pharmacists have expanded prescribing authority, which of the following remains outside their scope everywhere in Canada?",
     o:["Adapting an existing prescription's dose","Prescribing narcotics or other controlled substances under the CDSA","Renewing a stable chronic medication","Prescribing for an authorized minor ailment"], a:1,
     r:"Even in provinces with broad pharmacist prescribing authority, pharmacists cannot prescribe narcotics or other CDSA-controlled substances — this remains outside scope nationwide.", m:null},
    {t:"regs", q:"A patient asks why their fish oil supplement has an 'NPN' instead of a 'DIN' on the label. What does this indicate?",
     o:["NPN indicates it is a counterfeit product","NPN (Natural Product Number) indicates regulation as a Natural Health Product, while a DIN is assigned to conventional marketed drugs","NPN means the product has not been reviewed by Health Canada at all","NPN and DIN are interchangeable terms"], a:1,
     r:"Natural Health Products are regulated under a separate framework from conventional drugs and are assigned an NPN rather than a DIN, though both require Health Canada authorization to be sold legally.", m:null},

    {t:"pk", q:"A drug has a half-life of 8 hours. Approximately how long will it take to reach steady-state plasma concentration with regular dosing?",
     o:["8 hours","16 hours","32–40 hours (4–5 half-lives)","80 hours"], a:2,
     r:"Steady state is reached after approximately 4–5 half-lives of regular dosing, regardless of dose or interval. For an 8-hour half-life, that's roughly 32–40 hours.", m:null},
    {t:"pk", q:"Nitroglycerin for acute angina is given sublingually rather than orally. Why?",
     o:["Sublingual administration avoids extensive first-pass hepatic metabolism, allowing much faster and more reliable systemic levels","Sublingual tablets taste better","Oral nitroglycerin works just as fast","Sublingual administration increases first-pass metabolism"], a:0,
     r:"Nitroglycerin undergoes extensive first-pass hepatic metabolism when swallowed, giving negligible oral bioavailability. Sublingual (or IV/transdermal) routes bypass this for rapid, reliable absorption.",
     m:"“My Nice Puppy Loves” (high first-pass drugs) = Morphine, Nitroglycerin, Propranolol, Lidocaine."},
    {t:"pk", q:"A CYP2C19 poor metabolizer is prescribed clopidogrel after coronary stent placement. What is the clinical concern?",
     o:["Increased bleeding risk from excess active drug","Reduced conversion of clopidogrel (a prodrug) to its active metabolite, causing diminished antiplatelet effect and higher stent thrombosis risk","No clinical significance","Clopidogrel does not require metabolic activation"], a:1,
     r:"Clopidogrel requires CYP2C19-mediated activation. Poor metabolizers generate less active drug, resulting in inadequate platelet inhibition and higher cardiovascular event risk — an alternative agent may be considered.", m:null},
    {t:"pk", q:"A drug has a very large volume of distribution (Vd = 500 L in a 70 kg patient). What does this suggest?",
     o:["The drug stays almost entirely within the blood/plasma compartment","The drug distributes extensively into tissues outside the vascular compartment (Vd this large has no direct physiologic 'space')","The drug is highly water-soluble and stays intravascular","The drug cannot be dialyzed regardless of other properties"], a:1,
     r:"A Vd far exceeding total body water (~42 L) indicates extensive tissue distribution/binding (e.g., digoxin, chloroquine) rather than staying in the blood — relevant to loading dose calculations and dialyzability.", m:null},
    {t:"pk", q:"A drug has a target plasma concentration of 20 mg/L and a Vd of 50 L. Assuming 100% bioavailability (IV), what loading dose is required?",
     o:["250 mg","500 mg","1000 mg","2000 mg"], a:2,
     r:"Loading dose = Target Cp × Vd = 20 mg/L × 50 L = 1000 mg.", m:null},

    {t:"inter", q:"A patient stable on warfarin is started on amiodarone for atrial fibrillation. What adjustment is typically needed?",
     o:["No adjustment needed","Warfarin dose typically reduced by ~30–50% due to CYP2C9 inhibition and protein-binding displacement, with closer INR monitoring","Warfarin dose should be doubled","Amiodarone should never be combined with warfarin"], a:1,
     r:"Amiodarone potently inhibits CYP2C9 metabolism of warfarin and displaces it from plasma proteins. This interaction is significant and long-lasting (amiodarone has a very long half-life), requiring an empiric dose reduction with vigilant INR monitoring.", m:null},
    {t:"inter", q:"A patient stopped phenelzine (an MAOI) 10 days ago and now wants to start sertraline. What is the concern?",
     o:["No washout period is needed between MAOIs and SSRIs","A washout period (typically ≥14 days after stopping an MAOI) is required before starting an SSRI to avoid life-threatening serotonin syndrome","The two drugs are actually synergistic and recommended together","Only a 24-hour washout is needed"], a:1,
     r:"Combining MAOIs with SSRIs carries a high risk of severe/fatal serotonin syndrome. A washout of at least 14 days after stopping an MAOI (5 weeks after fluoxetine) is required before starting the other class.", m:null},
    {t:"inter", q:"A patient on citalopram 40 mg daily is prescribed azithromycin. What is the pharmacist's concern?",
     o:["No interaction of concern","Both drugs independently prolong the QT interval; the combination raises torsades de pointes risk, especially with other risk factors","Azithromycin will decrease citalopram levels","This combination improves antidepressant efficacy"], a:1,
     r:"Citalopram and azithromycin are both associated with dose-dependent QT prolongation; combining QT-prolonging drugs has an additive risk of torsades de pointes.", m:null},
    {t:"inter", q:"A patient taking simvastatin asks if it's safe to drink grapefruit juice regularly. What should the pharmacist advise?",
     o:["Grapefruit juice has no effect on statins","Grapefruit juice inhibits intestinal CYP3A4, raising exposure to CYP3A4-dependent statins and myopathy/rhabdomyolysis risk; advise avoiding or limiting it","Grapefruit juice only affects IV medications","Grapefruit juice will decrease simvastatin levels"], a:1,
     r:"Grapefruit juice inhibits CYP3A4 specifically in the gut wall, reducing first-pass metabolism and increasing oral bioavailability of substrates like simvastatin/lovastatin.", m:null},
    {t:"inter", q:"A patient taking a combined oral contraceptive starts self-treating mild depression with St. John's Wort. What is the concern?",
     o:["No interaction exists","St. John's Wort is a potent CYP3A4 inducer that can significantly reduce contraceptive hormone levels, raising the risk of contraceptive failure","St. John's Wort will make the contraceptive more effective","St. John's Wort only interacts with prescription antidepressants"], a:1,
     r:"St. John's Wort strongly induces CYP3A4 (and P-glycoprotein), lowering plasma levels of many drugs including combined hormonal contraceptives, cyclosporine, and warfarin.", m:null}
  ];

  var OSCE = [
    {id:"o1", ti:"New Prescription: Metformin", tl:5,
     sc:"Mr. David Chen, 55, is picking up his first prescription for metformin 500 mg PO BID, newly diagnosed with type 2 diabetes. He tells the technician he's worried about “the sugar pill making him gain weight.”",
     ta:"Counsel Mr. Chen on his new metformin prescription.",
     cl:["Introduces self and confirms patient identity (name + DOB)","Asks what the physician told him about the medication and diagnosis","Screens for allergies, other medications (incl. OTC/herbals), and renal/liver history","Explains action in plain language (helps the body use its own insulin; does not typically cause weight gain)","Explains instructions — take with food to reduce GI upset; may be titrated over time","Covers expected side effects (transient GI upset) and rare serious risk (lactic acidosis) without alarming him","Advises holding metformin around IV contrast dye studies or surgery","Gives red flags (severe vomiting, unusual muscle pain, difficulty breathing) and monitoring plan (A1C q3 months)","Checks understanding, invites questions, closes with follow-up"],
     mn:"Framework: SAILS — Store, Action, Instructions, Life effects, Seek help."},
    {id:"o2", ti:"New Prescription: Warfarin", tl:5,
     sc:"Mrs. Eleanor Vasquez, 70, is starting warfarin 5 mg daily for newly diagnosed atrial fibrillation. She takes ibuprofen occasionally for arthritis and eats a diet rich in leafy greens.",
     ta:"Counsel Mrs. Vasquez on her new warfarin therapy.",
     cl:["Introduction, identity confirmation, privacy check","Asks about diet, other medications (flags OTC ibuprofen), alcohol use, allergies","Explains action in plain language (prevents clot formation)","Explains INR monitoring purpose, frequency, and target range","Counsels on CONSISTENT (not avoided) vitamin K intake","Advises against regular NSAID use; recommends acetaminophen and discussion with prescriber","Reviews bleeding signs to watch for (bruising, blood in urine/stool, severe headache)","Advises informing all prescribers/dentists about warfarin use before any new drug or procedure","Closes, checks understanding, offers follow-up"],
     mn:"Memory anchor: “CHAMPS” raise INR — Cipro, azoles, Metronidazole, Phenytoin, Sulfonamides."},
    {id:"o3", ti:"OTC Triage: Chronic Cough", tl:5,
     sc:"A 61-year-old man asks for a “strong cough syrup.” The cough is dry, not productive, and has lasted about 6 weeks. He takes ramipril for hypertension.",

  /* ---------------- State ---------------- */
  var STORE_KEY = "pebcPrepState_v1";
  function loadState(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) return JSON.parse(raw);
    }catch(e){}
    return {mcqAttempts:[], osceAttempts:[]};
  }
  function saveState(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
  }
  var state = loadState();
  if (!state.mcqAttempts) state.mcqAttempts = [];
  if (!state.osceAttempts) state.osceAttempts = [];

  function computeStats(){
    var m = state.mcqAttempts, total = m.length, correct = 0;
    var byTopic = {};
    for (var i=0;i<m.length;i++){
      var a = m[i];
      if (!byTopic[a.topic]) byTopic[a.topic] = {total:0, correct:0};
      byTopic[a.topic].total++;
      if (a.correct){ correct++; byTopic[a.topic].correct++; }
    }
    var streak = 0, best = 0, run = 0;
    for (var j=0;j<m.length;j++){
      if (m[j].correct){ run++; if (run>best) best = run; } else { run = 0; }
    }
    for (var k=m.length-1;k>=0;k--){
      if (m[k].correct) streak++; else break;
    }
    var o = state.osceAttempts, oAvg = 0;
    if (o.length){
      var sum = 0; for (var x=0;x<o.length;x++) sum += o[x].score;
      oAvg = Math.round(sum / o.length);
    }
    return {total:total, correct:correct, pct: total? Math.round(correct/total*100):0,
      byTopic:byTopic, streak:streak, best:best, osceCount:o.length, osceAvg:oAvg};
  }

  function toast(msg){
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ el.classList.remove("show"); }, 2200);
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function fmtDate(ts){
    var d = new Date(ts);
    return d.toLocaleDateString(undefined,{month:"short",day:"numeric"}) + " " +
           d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
  }
  var speakingBtn = null;
  if ("speechSynthesis" in window){
    window.speechSynthesis.getVoices();
    window.speechSynthesis.addEventListener("voiceschanged", function(){ window.speechSynthesis.getVoices(); });
  }
  function speakDrugName(name, btnEl){
    if (!name || !("speechSynthesis" in window)) return;
    try{
      window.speechSynthesis.cancel();
      if (speakingBtn) speakingBtn.removeAttribute("data-playing");
      var u = new SpeechSynthesisUtterance(name);
      u.rate = 0.95;
      u.pitch = 1;
      var voices = window.speechSynthesis.getVoices();
      var enVoices = voices.filter(function(x){ return /^en/i.test(x.lang); });
      var quality = /Google|Natural|Enhanced|Premium|Neural|Siri/i;
      var v =
        enVoices.find(function(x){ return /^en-CA/i.test(x.lang) && quality.test(x.name); }) ||
        enVoices.find(function(x){ return quality.test(x.name); }) ||
        enVoices.find(function(x){ return /^en-CA/i.test(x.lang); }) ||
        enVoices.find(function(x){ return /^en-US/i.test(x.lang); }) ||
        enVoices[0];
      if (v) u.voice = v;
      if (btnEl){
        btnEl.setAttribute("data-playing","true");
        speakingBtn = btnEl;
        u.onend = u.onerror = function(){
          btnEl.removeAttribute("data-playing");
          if (speakingBtn===btnEl) speakingBtn = null;
        };
      }
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  function setView(v){ view = v; render(); }

  /* ---------------- MCQ logic ---------------- */
  function shuffle(arr){
    var a = arr.slice();
    for (var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp=a[i]; a[i]=a[j]; a[j]=tmp;
    }
    return a;
  }
  function buildQueue(){
    var pool = MCQ.map(function(q,idx){ return Object.assign({idx:idx}, q); });
    if (mcqFilter !== "all") pool = pool.filter(function(q){ return q.t===mcqFilter; });
    if (mcqDifficulty !== "all") pool = pool.filter(function(q){ return (q.d||"standard")===mcqDifficulty; });
    mcqQueue = shuffle(pool);
  }
  function nextQuestion(){
    if (!mcqQueue.length) buildQueue();
    mcqCurrent = mcqQueue.shift();
    mcqAnswered = false;
    render();
  }
  function answerMcq(optionIdx){
    if (mcqAnswered || !mcqCurrent) return;
    mcqAnswered = true;
    mcqCurrent._chosen = optionIdx;
    var correct = optionIdx === mcqCurrent.a;
    state.mcqAttempts.push({ts:Date.now(), topic:mcqCurrent.t, correct:correct, chosen:optionIdx});
    saveState();
    render();
  }

  /* ---------------- OSCE logic ---------------- */
  function openStation(id){
    for (var i=0;i<OSCE.length;i++){ if (OSCE[i].id===id){ osceCurrent = OSCE[i]; break; } }
    osceRevealed = false;
    stopTimer();
    timerSecs = (osceCurrent.tl||5)*60;
    render();
  }
  function closeStation(){
    osceCurrent = null; osceRevealed = false; stopTimer();
    render();
  }
  function startTimer(){
    if (timerRunning) return;
    timerRunning = true;
    timerHandle = setInterval(function(){
      timerSecs = Math.max(0, timerSecs-1);
      updateTimerDisplay();
      if (timerSecs===0){ stopTimer(); render(); }
    }, 1000);
    render();
  }
  function stopTimer(){
    timerRunning = false;
    if (timerHandle) clearInterval(timerHandle);
    timerHandle = null;
  }
  function resetTimer(){
    stopTimer();
    timerSecs = ((osceCurrent && osceCurrent.tl) || 5)*60;
    render();
  }
  function updateTimerDisplay(){
    var el = document.getElementById("clockDisplay");
    if (!el) return;
    var mm = Math.floor(timerSecs/60), ss = timerSecs%60;
    el.textContent = (mm<10?"0":"")+mm+":"+(ss<10?"0":"")+ss;
  }
  function revealChecklist(){ osceRevealed = true; render(); }
  function computeOsceScore(){
    var boxes = document.querySelectorAll(".check-item input");
    var checked = 0;
    boxes.forEach(function(b){ if (b.checked) checked++; });
    return boxes.length ? Math.round(checked/boxes.length*100) : 0;
  }
  function saveOsceAttempt(){
    var score = computeOsceScore();
    state.osceAttempts.push({ts:Date.now(), id:osceCurrent.id, title:osceCurrent.ti, score:score});
    saveState();
    toast("Station saved — self-score " + score + "%");
    render();
  }

  /* ---------------- Export / Import / Reset ---------------- */
  function exportProgress(){
    var payload = JSON.stringify(state, null, 2);
    (async function(){
      try{
        var downloads = (window.claude && typeof window.claude.use === "function")
          ? await window.claude.use("downloads") : null;
        if (downloads){
          await downloads.save({filename:"pebc-prep-progress.json", data:payload});
          toast("Progress exported.");
          return;
        }
      }catch(e){ /* fall through to manual copy */ }
      var blob;
      try{ blob = new Blob([payload], {type:"application/json"}); }catch(e){}
      if (blob && window.URL && window.URL.createObjectURL){
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = "pebc-prep-progress.json";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
        toast("Progress exported.");
      } else {
        toast("Export unavailable in this view.");
      }
    })();
  }
  function importProgress(file){
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        if (!data || !Array.isArray(data.mcqAttempts) || !Array.isArray(data.osceAttempts)){
          toast("That file doesn't look like a progress export.");
          return;
        }
        state = data;
        saveState();
        toast("Progress imported.");
        render();
      }catch(e){ toast("Couldn't read that file."); }
    };
    reader.readAsText(file);
  }
  function resetProgress(){
    if (!confirm("Clear all saved progress on this device? This can't be undone (export first if you want a backup).")) return;
    state = {mcqAttempts:[], osceAttempts:[]};
    saveState();
    toast("Progress reset.");
    render();
  }

  /* ---------------- Render: dashboard ---------------- */
  function renderDashboard(){
    var stats = computeStats();

      var s = stats.byTopic[tp.key];
      var pct = s && s.total ? Math.round(s.correct/s.total*100) : null;
      return {label:tp.label, pct:pct, total: s? s.total:0};
    }).filter(function(r){ return r.total>0; }).sort(function(a,b){ return a.pct-b.pct; });

    var recent = state.mcqAttempts.slice(-5).reverse().map(function(a){

        '<span class="pill '+(a.correct?'pill-correct':'pill-incorrect')+'">'+(a.correct?'Correct':'Incorrect')+'</span></div>';
    }).join("") || '<p class="empty" style="padding:14px 0;">No MCQ attempts yet.</p>';

    document.getElementById("main").innerHTML =
      '<div class="pagehead"><h1>Study dashboard</h1><p>Your PEBC MCQ accuracy and OSCE self-assessment, tracked in this browser.</p></div>'+
      '<div class="cards">'+

        '<div class="btn-row">'+
          '<button class="btn" id="btnExport">Export progress (.json)</button>'+

    document.getElementById("goMcq").addEventListener("click", function(){ setView("mcq"); });

  /* ---------------- Render: MCQ ---------------- */
  function renderMcq(){
    var options = '<option value="all">All topics</option>' + TOPICS.map(function(t){
      return '<option value="'+t.key+'"'+(mcqFilter===t.key?' selected':'')+'>'+t.label+'</option>';
    }).join("");

    var body;
    if (!mcqCurrent){
      body = '<div class="panel"><p style="color:var(--text-muted);">Pick a topic (or keep “All topics”) and start practicing. Questions are shuffled and won’t repeat until the set is exhausted.</p>'+
        '<div class="btn-row"><button class="btn btn-primary" id="startMcq">Start practicing</button></div></div>';
    } else {
      var letters = ["A","B","C","D"];
      var optsHtml = mcqCurrent.o.map(function(opt, i){
        var state_ = "";
        if (mcqAnswered){
          if (i===mcqCurrent.a) state_ = "correct";
          else if (i===mcqCurrent._chosen) state_ = "incorrect";
        }
        return '<button class="option" data-i="'+i+'" '+(mcqAnswered?'disabled':'')+(state_?' data-state="'+state_+'"':'')+'>'+
          '<span class="letter">'+letters[i]+'</span><span>'+esc(opt)+'</span></button>';
      }).join("");

      var fb = "";

        var isCorrect = mcqCurrent._chosen === mcqCurrent.a;

          '<div class="verdict">'+(isCorrect?"Correct":"Not quite")+'</div>'+

          (mcqCurrent.m ? '<div class="mnemonic">'+esc(mcqCurrent.m)+'</div>' : '')+

      body = '<div class="panel">'+

    document.getElementById("main").innerHTML =

      mcqDifficulty = e.target.value;
      mcqQueue = []; mcqCurrent = null; mcqAnswered = false;

        '<div class="scenario-box">'+esc(st.sc)+'</div>'+
        '<div class="timer-box"><span class="clock tnum" id="clockDisplay">'+clockStr+'</span>'+

    document.getElementById("backStations").addEventListener("click", closeStation);

  function buildKrollDiagram(){
    var stages = [
      "Rx Received\n(fax / e-Rx / verbal / transfer-in)",
      "Patient Profile\ncheck / update",
      "Data Entry\ndrug, DIN, Sig",
      "Clinical Check\nDUR, interactions, allergy",
      "Adjudication\ninsurance claim",
      "Fill & Label\nbatch / blister / compound",
      "RPh Verify\nbarcode scan",
      "Counsel & Bill\npickup, documentation"
    ];
    var bw=150, bh=74, gap=22, y=54;
    var svgW = stages.length*bw + (stages.length-1)*gap;
    var boxes = "", arrows = "";
    stages.forEach(function(label, i){
      var x = i*(bw+gap);
      var lines = label.split("\n");
      boxes += '<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="10" fill="var(--bg-elevated)" stroke="var(--accent)" stroke-width="1.5"></rect>';
      boxes += '<text x="'+(x+bw/2)+'" y="'+(y+30)+'" text-anchor="middle" font-size="12" font-weight="700" fill="var(--text)">'+esc(lines[0])+'</text>';
      boxes += '<text x="'+(x+bw/2)+'" y="'+(y+48)+'" text-anchor="middle" font-size="10.5" fill="var(--text-muted)">'+esc(lines[1]||"")+'</text>';
      if (i < stages.length-1){
        var ax = x+bw, ax2 = x+bw+gap;
        arrows += '<line x1="'+ax+'" y1="'+(y+bh/2)+'" x2="'+(ax2-6)+'" y2="'+(y+bh/2)+'" stroke="var(--gold)" stroke-width="2" marker-end="url(#krollArrow)"></line>';
      }
    });
    return '<div class="kroll-diagram-wrap"><svg viewBox="0 0 '+svgW+' 170" xmlns="http://www.w3.org/2000/svg">'+
      '<defs><marker id="krollArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="var(--gold)"></path></marker></defs>'+
      arrows+boxes+
    '</svg></div>';
  }

  }

  /* ---------------- Render: History ---------------- */
  function renderHistory(){
    var rows = [];
    state.mcqAttempts.forEach(function(a){
      rows.push({ts:a.ts, type:"MCQ", detail:topicLabel(a.topic), result:a.correct});
    });
    state.osceAttempts.forEach(function(a){
      rows.push({ts:a.ts, type:"OSCE", detail:a.title, result:a.score+"%"});
    });
    rows.sort(function(a,b){ return b.ts-a.ts; });

    var tableRows = rows.map(function(r){
      var resultHtml;
      if (r.type==="MCQ"){
        resultHtml = '<span class="pill '+(r.result?'pill-correct':'pill-incorrect')+'">'+(r.result?'Correct':'Incorrect')+'</span>';
      } else {
        resultHtml = '<span class="pill pill-osce">'+r.result+'</span>';
      }
      return '<tr><td class="tnum" style="color:var(--text-muted);">'+fmtDate(r.ts)+'</td>'+
        '<td>'+r.type+'</td><td>'+esc(r.detail)+'</td><td>'+resultHtml+'</td></tr>';
    }).join("");

    document.getElementById("main").innerHTML =
      '<div class="pagehead"><h1>History</h1><p>Every MCQ and OSCE self-assessment logged in this browser.</p></div>'+
      (rows.length ?
        '<div class="panel"><div class="hist-scroll"><table class="hist-table">'+
          '<thead><tr><th>When</th><th>Type</th><th>Item</th><th>Result</th></tr></thead>'+
          '<tbody>'+tableRows+'</tbody></table></div></div>'
        : '<div class="panel"><p class="empty">No activity yet — head to MCQ Practice or OSCE Stations to get started.</p></div>');
  }

  /* ---------------- Main render ---------------- */
  function render(){
    renderRail();
    if (view==="dashboard") renderDashboard();
    else if (view==="mcq") renderMcq();
    else if (view==="osce") renderOsce();
    else if (view==="study") renderStudyGuides();
    else if (view==="drugs") renderDrugs();
    else if (view==="schedules") renderDrugSchedules();
    else if (view==="calc") renderCalculations();
    else if (view==="ref") renderReference();
    else if (view==="history") renderHistory();
  }

  render();
})();
</script>
</body>
</html>
